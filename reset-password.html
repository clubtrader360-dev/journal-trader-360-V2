<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Réinitialiser mon mot de passe — Trader 360</title>
    <link rel="icon" href="/assets/trader360-logo-clean.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a;
            background:
                radial-gradient(1100px 600px at 20% 20%, rgba(172,134,43,0.18), transparent 55%),
                radial-gradient(900px 500px at 80% 80%, rgba(0,33,102,0.4), transparent 60%),
                linear-gradient(135deg, #000B25 0%, #001a45 50%, #000B25 100%);
        }
        .rp-card {
            width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 34px 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        }
        .rp-logo { text-align: center; margin-bottom: 22px; }
        .rp-logo img { width: 110px; height: auto; }
        .rp-logo .sub { color: #64748b; font-size: 0.8rem; margin-top: 10px; }
        h1 { font-size: 20px; font-weight: 700; color: #0F1C3D; text-align: center; margin-bottom: 8px; }
        .rp-lead { font-size: 13.5px; color: #5a5040; text-align: center; line-height: 1.5; margin-bottom: 22px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #0F1C3D; margin-bottom: 6px; }
        .pw-wrap { position: relative; }
        .form-group input {
            width: 100%; padding: 11px 42px 11px 14px; border-radius: 10px; font-size: 14px;
            background: #E8F4FD; color: #000B25; border: 1px solid rgba(0,11,37,0.2); outline: none;
        }
        .form-group input:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,0.25); }
        .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: 0; cursor: pointer; color: #64748b; font-size: 15px; }
        .pw-strength { height: 6px; border-radius: 999px; background: #e5e7eb; overflow: hidden; margin-top: 8px; }
        .pw-strength > span { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .25s, background .25s; }
        .pw-strength-label { font-size: 11.5px; margin-top: 5px; color: #64748b; }
        .rp-btn {
            width: 100%; padding: 12px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
            background: #d4af37; color: #000B25; transition: filter .13s;
        }
        .rp-btn:hover { filter: brightness(1.05); }
        .rp-btn:disabled { opacity: 0.6; cursor: default; }
        .rp-btn-secondary { background: transparent; color: #0F1C3D; border: 1px solid #0F1C3D; margin-top: 10px; }
        .rp-msg { font-size: 13px; margin-top: 14px; padding: 12px 14px; border-radius: 10px; display: none; line-height: 1.5; }
        .rp-msg.error { background: rgba(198,40,40,0.1); color: #b91c1c; display: block; }
        .rp-msg.success { background: rgba(6,122,79,0.1); color: #067a4f; display: block; }
        .rp-state-invalid, .rp-loading { text-align: center; }
        .rp-loading .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid rgba(212,175,55,0.3); border-top-color: #d4af37; border-radius: 50%; animation: rpspin .8s linear infinite; }
        @keyframes rpspin { to { transform: rotate(360deg); } }
        .rp-hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="rp-card">
        <div class="rp-logo">
            <img src="/assets/trader360-logo-clean.png" alt="Trader 360">
            <div class="sub">Journal de Trading Professionnel</div>
        </div>

        <!-- État : chargement -->
        <div id="rpLoading" class="rp-loading">
            <div class="spin"></div>
            <p style="color:#5a5040; font-size:13.5px; margin-top:14px;">Vérification du lien…</p>
        </div>

        <!-- État : lien invalide / expiré -->
        <div id="rpInvalid" class="rp-state-invalid rp-hidden">
            <h1>Lien invalide ou expiré</h1>
            <p class="rp-lead">Ce lien de réinitialisation n'est plus valide (déjà utilisé ou expiré après 1&nbsp;heure). Demande-en un nouveau depuis la page de connexion.</p>
            <button type="button" class="rp-btn" onclick="window.location.href='/index.html'">Retour à la connexion</button>
        </div>

        <!-- État : formulaire -->
        <div id="rpForm" class="rp-hidden">
            <h1>Nouveau mot de passe</h1>
            <p class="rp-lead">Choisis un nouveau mot de passe (6 caractères minimum).</p>
            <div class="form-group">
                <label for="rpPassword">Nouveau mot de passe</label>
                <div class="pw-wrap">
                    <input type="password" id="rpPassword" autocomplete="new-password" placeholder="••••••••">
                    <button type="button" class="pw-toggle" data-target="rpPassword" aria-label="Afficher / masquer">👁</button>
                </div>
                <div class="pw-strength"><span id="rpStrengthBar"></span></div>
                <div class="pw-strength-label" id="rpStrengthLabel"></div>
            </div>
            <div class="form-group">
                <label for="rpConfirm">Confirmer le mot de passe</label>
                <div class="pw-wrap">
                    <input type="password" id="rpConfirm" autocomplete="new-password" placeholder="••••••••">
                    <button type="button" class="pw-toggle" data-target="rpConfirm" aria-label="Afficher / masquer">👁</button>
                </div>
            </div>
            <button type="button" id="rpSubmit" class="rp-btn">Réinitialiser mon mot de passe</button>
            <div id="rpMsg" class="rp-msg"></div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';
        var SUPABASE_URL = 'https://zgihbpgoorymomtsbxpz.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnaWhicGdvb3J5bW9tdHNieHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NTkyODgsImV4cCI6MjA3OTEzNTI4OH0.eGTwcpYON_uP3ppOhVIWs4qKJLjn9TyE7usGnvU4oRA';

        if (typeof supabase === 'undefined') { showInvalid(); return; }
        // Client DÉDIÉ à cette page : detectSessionInUrl:true → parse le token recovery de l'URL
        // et déclenche PASSWORD_RECOVERY (le client principal du site est en detectSessionInUrl:false).
        var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { detectSessionInUrl: true, autoRefreshToken: false, persistSession: false }
        });

        var shown = false;
        function el(id) { return document.getElementById(id); }
        function showForm() { if (shown) return; shown = true; el('rpLoading').classList.add('rp-hidden'); el('rpInvalid').classList.add('rp-hidden'); el('rpForm').classList.remove('rp-hidden'); }
        function showInvalid() { if (shown) return; shown = true; el('rpLoading').classList.add('rp-hidden'); el('rpForm').classList.add('rp-hidden'); el('rpInvalid').classList.remove('rp-hidden'); }

        // 1) Événement d'auth : PASSWORD_RECOVERY (ou SIGNED_IN au retour du lien).
        sb.auth.onAuthStateChange(function (event, session) {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) showForm();
        });

        // 2) Détection d'une erreur dans l'URL (token expiré/invalide) → message clair.
        var hash = window.location.hash || '';
        if (/error=|error_code=|error_description=/.test(hash)) { showInvalid(); }

        // 3) Fallback : après un court délai, si le formulaire n'est pas affiché, on lit getSession().
        setTimeout(function () {
            if (shown) return;
            sb.auth.getSession().then(function (r) {
                if (r && r.data && r.data.session) showForm(); else showInvalid();
            }).catch(showInvalid);
        }, 1500);

        // ---- Toggle afficher/masquer ----
        document.querySelectorAll('.pw-toggle').forEach(function (b) {
            b.addEventListener('click', function () {
                var inp = el(b.getAttribute('data-target')); if (!inp) return;
                inp.type = inp.type === 'password' ? 'text' : 'password';
                b.textContent = inp.type === 'password' ? '👁' : '🙈';
            });
        });

        // ---- Jauge de force ----
        function strength(pw) {
            var score = 0;
            if (pw.length >= 6) score++;
            if (pw.length >= 10) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            return Math.min(score, 4); // 0..4
        }
        el('rpPassword').addEventListener('input', function () {
            var s = strength(this.value);
            var bar = el('rpStrengthBar'), lbl = el('rpStrengthLabel');
            var pct = [0, 25, 50, 80, 100][s];
            var color = ['#e5e7eb', '#c62828', '#d97706', '#ca8a04', '#067a4f'][s];
            var text = ['', 'Faible', 'Moyen', 'Bon', 'Fort'][s];
            bar.style.width = pct + '%'; bar.style.background = color;
            lbl.textContent = this.value ? text : '';
        });

        // ---- Soumission ----
        function showMsg(text, kind) { var m = el('rpMsg'); m.textContent = text; m.className = 'rp-msg ' + kind; }
        el('rpSubmit').addEventListener('click', async function () {
            var btn = this;
            var pw = el('rpPassword').value;
            var confirm = el('rpConfirm').value;
            if (pw.length < 6) { showMsg('Le mot de passe doit contenir au moins 6 caractères.', 'error'); return; }
            if (pw !== confirm) { showMsg('Les deux mots de passe ne correspondent pas.', 'error'); return; }
            try {
                btn.disabled = true; btn.textContent = 'Réinitialisation…';
                var res = await sb.auth.updateUser({ password: pw });
                if (res.error) {
                    var msg = res.error.message || '';
                    if (/different from the old/i.test(msg)) showMsg('Le nouveau mot de passe doit être différent de l\'ancien.', 'error');
                    else if (/at least 6/i.test(msg)) showMsg('Le mot de passe doit contenir au moins 6 caractères.', 'error');
                    else if (/expired|invalid|session/i.test(msg)) showMsg('Ta session de réinitialisation a expiré. Redemande un lien.', 'error');
                    else showMsg('Impossible de réinitialiser le mot de passe. Réessaie.', 'error');
                    btn.disabled = false; btn.textContent = 'Réinitialiser mon mot de passe';
                    return;
                }
                showMsg('Mot de passe réinitialisé avec succès. Redirection vers la connexion…', 'success');
                // Sign out → force la reconnexion avec le nouveau mot de passe.
                try { await sb.auth.signOut(); } catch (_) {}
                setTimeout(function () { window.location.href = '/index.html'; }, 2000);
            } catch (e) {
                showMsg('Une erreur est survenue. Réessaie.', 'error');
                btn.disabled = false; btn.textContent = 'Réinitialiser mon mot de passe';
            }
        });
        el('rpConfirm').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('rpSubmit').click(); });
    })();
    </script>
</body>
</html>
