name: Rappels des webinaires

# Tous les quarts d'heure : la veille et une heure avant chaque webinaire publié, le
# site envoie aux inscrits leur lien personnel du direct (src/serveur/webinaires.ts,
# dépôt du site). Ce workflow ne fait que déclencher : /api/cron/daily-brief, mode
# `rappels_webinaires`, qui appelle /api/tunnels du site avec BACKOFFICE_CLE.
#
# ⚠️ GitHub retarde souvent les tâches planifiées de 5 à 20 minutes, et en saute
# parfois une aux heures chargées. Les fenêtres d'envoi en tiennent compte (rappel
# « une heure avant » envoyable de 75 min avant à 10 min après le début), et chaque
# envoi est réservé en base : un passage en retard ou relancé n'envoie jamais deux fois.
# ⛔ Un passage qui ne trouve aucun webinaire dans sa fenêtre ne fait rien : c'est le
# cas normal, pas un échec. Un envoi refusé par Brevo, lui, rend le run rouge.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: webinaires-rappels
  cancel-in-progress: false

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher les rappels
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET manquant côté GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          reponse=$(curl -sS --max-time 120 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{"rappels_webinaires":true}' \
            "https://www.journaltrader360.fr/api/cron/daily-brief")
          code=$(echo "$reponse" | tail -n1)
          corps=$(echo "$reponse" | sed '$d')
          echo "HTTP $code"
          echo "$corps"
          if [ "$code" != "200" ]; then
            echo "::error::Rappels des webinaires : HTTP $code"
            exit 1
          fi
