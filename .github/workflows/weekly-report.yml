name: Weekly Trader 360 Report

on:
  schedule:
    # Dimanche 16h UTC = 18h Paris (CEST/été).
    # ⚠️ À ajuster à '0 17 * * 0' en octobre 2026 (passage CET/hiver) — sinon les mails partiront à 17h Paris.
    - cron: '0 16 * * 0'
  workflow_dispatch:
    # Déclenchement manuel depuis l'UI GitHub Actions (test + force-send hors cadence).
    inputs:
      reason:
        description: 'Raison du déclenchement manuel (log)'
        required: false
        default: 'Test manuel'
      only_user_id:
        description: 'UUID élève cible (test ciblé — vide = envoi à TOUS les éligibles)'
        required: false
        default: ''

jobs:
  send-weekly-report:
    name: Trigger weekly report endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /api/cron/weekly-report
        id: ping
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REASON: ${{ github.event.inputs.reason || 'cron auto' }}
          ONLY_USER_ID: ${{ github.event.inputs.only_user_id }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant côté GitHub. Settings → Secrets and variables → Actions → crée 'CRON_SECRET' (même valeur que l'env var Vercel)."
            exit 1
          fi

          # URL avec ?onlyUserId=<uuid> optionnel (test ciblé). Validation format UUID (anti-injection URL).
          URL="https://www.journaltrader360.fr/api/cron/weekly-report"
          if [ -n "$ONLY_USER_ID" ]; then
            if ! echo "$ONLY_USER_ID" | grep -qiE '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'; then
              echo "::error::only_user_id invalide (UUID attendu) : '$ONLY_USER_ID'"
              exit 1
            fi
            URL="${URL}?onlyUserId=${ONLY_USER_ID}"
            echo "🎯 Mode test ciblé : onlyUserId=$ONLY_USER_ID"
          else
            echo "🚀 Envoi à TOUS les éligibles (raison: $REASON)"
          fi

          response=$(curl -sSL -w "\n---HTTP_STATUS:%{http_code}---" -X GET \
            "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 240 \
            --retry 2 --retry-delay 10)

          body=$(echo "$response" | sed -e 's/---HTTP_STATUS:.*//')
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)

          echo "HTTP Status: $status"
          echo "Response body:"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Endpoint weekly-report a répondu $status (attendu 200). Body ci-dessus."
            exit 1
          fi

          # Le handler renvoie { eligible: N, results: [ { status: 'sent'|'failed'|'skipped'|... } ] }.
          # On compte les occurrences de statut dans le tableau results (pas de clés sent/failed agrégées).
          eligible=$(echo "$body" | grep -oE '"eligible":[0-9]+' | cut -d: -f2 || echo "?")
          sent=$(echo "$body" | grep -oc '"status":"sent"' || true)
          failed=$(echo "$body" | grep -oc '"status":"failed"' || true)
          skipped=$(echo "$body" | grep -oc '"status":"skipped"' || true)

          echo "✅ Succès : $sent envoyé(s) · $failed échec(s) · $skipped skippé(s) · $eligible éligible(s)"

          if [ "${failed:-0}" -gt 0 ]; then
            echo "::warning::$failed mail(s) ont échoué côté Resend. Voir le JSON ci-dessus."
          fi
          # Expose les compteurs au step de notif Discord.
          { echo "sent=${sent:-0}"; echo "failed=${failed:-0}"; echo "skipped=${skipped:-0}"; echo "eligible=${eligible:-0}"; } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CRON_WEBHOOK_URL }}
          PING_OUTCOME: ${{ steps.ping.outcome }}
          SENT: ${{ steps.ping.outputs.sent }}
          FAILED: ${{ steps.ping.outputs.failed }}
          ELIGIBLE: ${{ steps.ping.outputs.eligible }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_CRON_WEBHOOK_URL absent — notif Discord ignorée."
            exit 0
          fi
          DATE_DISP=$(TZ=Europe/Paris date +%Y-%m-%d)
          GOLD=13938487   # 0xd4af37
          RED=15680580    # 0xef4444
          FAILED_N=$(echo "${FAILED:-0}" | grep -oE '^[0-9]+$' || echo 0)
          if [ "$PING_OUTCOME" = "success" ]; then
            if [ "$FAILED_N" -gt 0 ]; then COLOR=$RED; else COLOR=$GOLD; fi
            PAYLOAD=$(jq -n --argjson c "$COLOR" --arg date "$DATE_DISP" \
              --arg served "${SENT:-?} / ${ELIGIBLE:-?}" --arg failed "${FAILED:-0}" --arg url "$RUN_URL" \
              '{embeds:[{title:"📨 Rapport hebdo envoyé",color:$c,fields:[
                {name:"Date",value:$date,inline:true},
                {name:"Élèves servis",value:$served,inline:true},
                {name:"Échecs",value:$failed,inline:true},
                {name:"Run",value:("[Voir le run](\($url))"),inline:false}
              ],timestamp:(now|todate)}]}')
          else
            PAYLOAD=$(jq -n --argjson c "$RED" --arg date "$DATE_DISP" --arg url "$RUN_URL" \
              '{embeds:[{title:"❌ ÉCHEC envoi rapport hebdo",color:$c,description:("Rapport du \($date) — échec du pipeline.\n[Voir le run](\($url))"),timestamp:(now|todate)}]}')
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" \
            && echo "✅ Notif Discord envoyée" || echo "::warning::Échec de la notif Discord (non bloquant)."

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Report Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger** : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status** : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run** : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
