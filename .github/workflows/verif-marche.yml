name: Vérification collecte marché

# Jetable comme la sonde qui l'a précédée : elle sert à établir, DEPUIS LE RUNNER, que
# la collecte tient. Elle sera retirée une fois la refonte validée — son rôle est de
# fournir des preuves, pas de rester.
# Le filtre nommait UNE branche, celle du premier chantier. Elle a été supprimée au
# merge, et la suite a donc cessé de se déclencher sans rien signaler : le chantier
# suivant a été poussé sans qu'aucune vérification ne tourne. Un déclencheur qui ne se
# déclenche plus ne produit pas d'échec, il produit un silence — et un silence se lit
# comme un succès.
on:
  push:
    branches: ['chantier/**']
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 1. Sources encore éprouvées depuis ce runner
        run: node outils/sonder-sources.mjs

      - name: 2. La collecte, telle qu'elle sera injectée
        run: node outils/marche.mjs collecte

      - name: 3. Dix collectes consécutives — déterminisme
        run: node outils/marche.mjs determinisme 10

      - name: 4. Trois séances passées contre relevé — séance ET semaine
        run: node outils/marche.mjs comparaison

      - name: 4bis. Les dix runs audités rejoués contre la nouvelle règle
        run: node outils/retrospective.mjs

      - name: 4ter. Divergence forcée entre chemins + contrôle de contrat
        run: node outils/marche.mjs divergence-forcee

      - name: 4quater. Les instantanés sont lus de bout en bout, les mauvais rejetés
        run: node outils/marche.mjs instantanes-test

      - name: 5. Contrôles mis en échec — la valeur devient n/d avec son motif
        run: node outils/marche.mjs echec-force

      - name: 6. Instantané de clôture (hors fenêtre — doit être marqué comme tel)
        run: |
          H=$(TZ=America/New_York date +%H:%M)
          echo "Heure de New York : $H — la fenêtre de prélèvement est 17h00-17h59."
          node outils/marche.mjs instantane || echo "Prélèvement refusé par ses propres contrôles (attendu hors fenêtre)."
