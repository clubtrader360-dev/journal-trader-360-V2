name: Daily Brief Trader 360

# ══ BRIEF V22 (Manu, 26/11/2026) ════════════════════════════════════════════════
# Envoi du lundi au vendredi à 5h43 Paris, jamais le samedi ni le dimanche.
#
# ⚠️ POURQUOI LE JOB DÉMARRE À 3H13 ET N'ENVOIE QU'À 5H43. Les crons GitHub partent
# souvent en retard (plusieurs heures mesurées sur les minutes rondes). Démarrer tôt
# laisse la marge de collecter, de relancer si une valeur manque, puis d'attendre 5h43.
# La génération est faite vers 5h05, pour que « Ce matin et à surveiller » soit frais.
# Un run parti après 5h43 envoie dès que le brief est prêt et contrôlé.
#
# Deux crons, un par saison : 3h13 Paris = 2h13 UTC en hiver (CET), 1h13 UTC en été
# (CEST). Le garde « saison » ne laisse passer que celui qui tombe à 3h13 Paris ce
# jour-là. Jours 1-5 en UTC = lundi-vendredi à Paris à ces heures.
#
# ⛔ JAMAIS UNE VALEUR MANQUANTE (point 3 du cahier des charges v22).
# Tant qu'une valeur manque, collecte relancée toutes les 10 minutes, sans limite : au
# bout de 5 heures le run se relance lui-même (workflow_dispatch, droit actions:write).
# Alerte Discord au PREMIER échec, en nommant chaque valeur et les sources essayées.
# Même règle si la prose du modèle échoue à un contrôle (cohérence, deux-points, tirets).
on:
  schedule:
    - cron: '13 2 * * 1-5'   # hiver : 3h13 Paris
    - cron: '13 1 * * 1-5'   # été : 3h13 Paris
  workflow_dispatch:
    inputs:
      mode:
        description: "apercu (aucun envoi, HTML en artefact) · essai (test_email seul) · production (liste des membres)"
        required: true
        default: 'apercu'
        type: choice
        options: [apercu, essai, production]
      date:
        description: 'Date du brief AAAA-MM-JJ (vide = aujourd hui à Paris)'
        required: false
        default: ''
      test_email:
        description: 'Mode essai : seule adresse destinataire'
        required: false
        default: ''
      tentative:
        description: 'Relance automatique : numéro de tentative (ne pas remplir)'
        required: false
        default: '1'
      alerte_envoyee:
        description: 'Relance automatique : alerte de collecte déjà partie (ne pas remplir)'
        required: false
        default: '0'

# contents: write → archive (branche donnees-culture) et marqueur d'envoi (étiquette).
# actions: write → relance du workflow par lui-même au-delà de 5 heures.
permissions:
  contents: write
  actions: write

concurrency:
  group: daily-brief-${{ github.event.inputs.mode || 'production' }}
  cancel-in-progress: false

jobs:
  brief:
    name: Brief v22 (collecte, génération, contrôles, envoi à 5h43)
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Garde saison, date et envoi déjà fait
        id: garde
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_TEST: ${{ github.event.inputs.test_email }}
        run: |
          set -eu
          if [ "$EVENT" = "schedule" ]; then
            OFFSET=$(TZ=Europe/Paris date +%z)
            if { [ "$OFFSET" = "+0100" ] && [ "$SCHEDULE" != "13 2 * * 1-5" ]; } \
               || { [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" != "13 1 * * 1-5" ]; }; then
              echo "⏭️ Cron « $SCHEDULE » hors saison (Paris $OFFSET) : l'autre cron fait le brief."
              echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
            fi
            MODE=production
          else
            MODE="$IN_MODE"
          fi
          DATE_ISO="${IN_DATE:-$(TZ=Europe/Paris date +%Y-%m-%d)}"
          echo "$DATE_ISO" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::date invalide « $DATE_ISO »"; exit 1; }
          DOW=$(date -d "$DATE_ISO" +%u)
          if [ "$MODE" = "production" ] && [ "$DOW" -gt 5 ]; then
            echo "⏭️ $DATE_ISO est un week-end : aucun brief."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MODE" = "essai" ] && ! echo "$IN_TEST" | grep -qE '^[^@ ]+@[^@ ]+\.[a-z]{2,}$'; then
            echo "::error::Mode essai sans test_email valide : rien ne part."; exit 1
          fi
          if [ "$MODE" = "production" ] && git ls-remote --exit-code --tags origin "refs/tags/brief-envoye-$DATE_ISO" >/dev/null 2>&1; then
            echo "⏭️ Brief du $DATE_ISO déjà envoyé (étiquette brief-envoye-$DATE_ISO) : aucun doublon."
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DATE_LONG_FR=$(node -e "import('./api/_lib/date-fr.js').then(m=>process.stdout.write(m.formatDateLongFr('$DATE_ISO')))")
          [ -n "$DATE_LONG_FR" ] || { echo "::error::formatage de la date impossible"; exit 1; }
          { echo "go=1"; echo "mode=$MODE"; echo "date_iso=$DATE_ISO"; echo "date_long_fr=$DATE_LONG_FR"; } >> "$GITHUB_OUTPUT"
          echo "📅 Brief du $DATE_LONG_FR · mode $MODE"

      - name: Tests du brief v22 (référence et source muette)
        if: steps.garde.outputs.go == '1'
        run: |
          node outils/test-brief-v22.mjs
          node outils/test-source-muette.mjs

      - name: Install Claude Code CLI
        if: steps.garde.outputs.go == '1'
        run: npm install -g @anthropic-ai/claude-code

      - name: Cycle (collecte, relances, génération, contrôles)
        id: cycle
        if: steps.garde.outputs.go == '1'
        timeout-minutes: 335
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_ALERTE_URL: ${{ secrets.DISCORD_CRON_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.garde.outputs.mode }}
          DATE_ISO: ${{ steps.garde.outputs.date_iso }}
          DATE_LONG_FR: ${{ steps.garde.outputs.date_long_fr }}
          IN_TEST: ${{ github.event.inputs.test_email }}
          TENTATIVE: ${{ github.event.inputs.tentative || '1' }}
          ALERTE_COLLECTE: ${{ github.event.inputs.alerte_envoyee || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # ⚠️ GitHub lance bash avec -e et pipefail : la collecte rend 3 quand une valeur
          # manque, ce qui couperait l'étape au lieu de relancer. Codes gérés à la main.
          set +e +o pipefail
          set -u
          { echo "mode=$MODE"; echo "date_iso=$DATE_ISO"; echo "date_long_fr=$DATE_LONG_FR"; } >> "$GITHUB_OUTPUT"
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN manquant"; exit 1; }
          # Le webhook d'alerte n'est utilisé qu'en production : un aperçu ou un essai qui
          # échoue se lit dans le run, sans réveiller le salon.
          [ "$MODE" = "production" ] || DISCORD_ALERTE_URL=""
          export DISCORD_ALERTE_URL
          LIMITE=$(( $(date +%s) + 300 * 60 ))
          ALERTE_CONTROLE=0

          relancer() {
            echo "⏳ 5 heures écoulées sans brief complet : le workflow se relance (tentative $TENTATIVE)."
            gh workflow run daily-brief.yml --ref "$GITHUB_REF_NAME" -f mode="$MODE" -f date="$DATE_ISO" \
              -f test_email="${IN_TEST:-}" -f tentative="$TENTATIVE" -f alerte_envoyee="$ALERTE_COLLECTE"
            echo "relance=1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          dormir() { [ $(( $(date +%s) + 600 )) -lt "$LIMITE" ] || relancer; echo "😴 nouvelle tentative dans 10 minutes"; sleep 600; TENTATIVE=$((TENTATIVE + 1)); }
          attendre() { # attendre HH:MM (heure de Paris, le jour du brief)
            local cible; cible=$(TZ=Europe/Paris date -d "$DATE_ISO $1" +%s)
            local reste=$(( cible - $(date +%s) ))
            if [ "$reste" -gt 0 ]; then echo "⏰ attente jusqu'à $1 Paris ($((reste / 60)) min)"; sleep "$reste"; fi
          }

          # ── 1. COLLECTE, jusqu'à ce que TOUT soit là ───────────────────────────────
          while true; do
            echo "═══ Collecte, tentative $TENTATIVE ═══"
            node outils/brief-v22.mjs collecte "$DATE_ISO" /tmp/donnees.json
            RC=$?
            [ "$RC" -eq 0 ] && break
            if [ "$ALERTE_COLLECTE" = "0" ]; then
              if [ "$RC" -eq 3 ]; then node outils/brief-v22.mjs alerte /tmp/donnees.json "$RUN_URL" "$TENTATIVE" || true
              else echo "collecte en erreur (code $RC), voir le run" > /tmp/motifs.txt
                   node outils/brief-v22.mjs alerte-controle "$DATE_ISO" /tmp/motifs.txt "$RUN_URL" || true; fi
              ALERTE_COLLECTE=1
            fi
            dormir
          done
          cp /tmp/donnees.json /tmp/donnees-retenues.json

          # ── 2. GÉNÉRATION vers 5h05 en production, puis contrôles ─────────────────
          [ "$MODE" = "production" ] && attendre 05:05
          NOTION=$(node -e "import('./api/_lib/culture-marche.js').then(m=>{const n=m.notionDuJour('$DATE_ISO');process.stdout.write(n?('Notion de culture du jour : '+n.nom+'. Angle à traiter : '+n.angle+'.'):'')})")
          HORAIRES=$(node -e "import('./api/_lib/heure-marche.js').then(m=>process.stdout.write(m.contexteHoraire('$DATE_ISO')))")
          while true; do
            echo "═══ Génération, tentative $TENTATIVE ═══"
            PROMPT="$(printf 'Date du jour (Europe/Paris) : %s (%s).\n%s\n%s\n\n%s\n\n%s' "$DATE_LONG_FR" "$DATE_ISO" "$HORAIRES" "$NOTION" \
              "$(node outils/brief-v22.mjs prompt /tmp/donnees.json)" "$(cat .github/workflows/prompts/daily-brief-system.md)")"
            # stream-json : on lit le texte final ET on compte les vraies recherches web.
            # Mesuré le 26/11/2026 : une prose écrite en deux minutes, sans une seule
            # recherche, annonçait une décision de la Fed un jour de Thanksgiving.
            # Refus précédent : le modèle reçoit les motifs, pour corriger au lieu de recommencer à l'aveugle.
            if [ -s /tmp/motifs.txt ] && [ "$ALERTE_CONTROLE" = "1" ]; then
              PROMPT="$PROMPT"$'\n\n⛔ TA VERSION PRÉCÉDENTE A ÉTÉ REFUSÉE PAR LE CODE pour ces motifs. Corrige-les tous :\n'"$(cat /tmp/motifs.txt)"
            fi
            # Délai de garde : un modèle bloqué ne doit pas geler l'étape pendant des heures.
            echo "$PROMPT" | timeout 1500 claude -p --output-format stream-json --verbose --dangerously-skip-permissions > /tmp/claude.jsonl 2>/tmp/claude_err.log
            RC=$?
            jq -r 'select(.type=="result") | .result // empty' /tmp/claude.jsonl > /tmp/sortie-modele.txt 2>/dev/null
            WEB=$(jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="tool_use") | .name' /tmp/claude.jsonl 2>/dev/null | grep -cE '^(WebSearch|WebFetch)$')
            echo "🔎 Recherches web du modèle : $WEB ($(jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="tool_use") | .name' /tmp/claude.jsonl 2>/dev/null | sort | uniq -c | tr '\n' ' '))"
            if [ "$RC" -ne 0 ] || [ ! -s /tmp/sortie-modele.txt ]; then
              tail -20 /tmp/claude_err.log
              echo "Claude CLI a échoué (code $RC) : $(tail -3 /tmp/claude_err.log | tr '\n' ' ' | cut -c1-300)" > /tmp/motifs.txt
            elif [ "${WEB:-0}" -lt 3 ]; then
              echo "prose écrite sans recherche web ($WEB appel(s) WebSearch/WebFetch, 3 exigés)" > /tmp/motifs.txt
              cat /tmp/motifs.txt
            elif node outils/brief-v22.mjs assembler /tmp/donnees.json /tmp/sortie-modele.txt /tmp/brief.html /tmp/motifs.txt; then
              break
            fi
            echo "--- sortie du modèle (début) ---"; head -c 3000 /tmp/sortie-modele.txt 2>/dev/null; echo
            if [ "$ALERTE_CONTROLE" = "0" ]; then
              node outils/brief-v22.mjs alerte-controle "$DATE_ISO" /tmp/motifs.txt "$RUN_URL" || true
              ALERTE_CONTROLE=1
            fi
            # Contrôle refusé : nouvelle génération après 2 minutes, motifs joints au prompt.
            [ $(( $(date +%s) + 120 )) -lt "$LIMITE" ] || relancer
            echo "🔁 nouvelle génération dans 2 minutes, motifs du refus joints"; sleep 120; TENTATIVE=$((TENTATIVE + 1))
          done

          # Aperçus (membres, prospects, archive) en artefact, pour relecture.
          mkdir -p /tmp/apercus
          for V in members prospects archive; do
            node outils/brief-v22.mjs apercu /tmp/donnees.json /tmp/sortie-modele.txt "/tmp/apercus/brief-$DATE_ISO-$V.html" "$V" essai
          done
          node outils/brief-v22.mjs resume /tmp/donnees.json > /tmp/apercus/collecte-$DATE_ISO.txt
          cp /tmp/sortie-modele.txt /tmp/donnees.json /tmp/brief.html /tmp/apercus/
          echo "pret=1" >> "$GITHUB_OUTPUT"

          # ── 3. ENVOI à 5h43 en production ──────────────────────────────────────────
          [ "$MODE" = "production" ] && attendre 05:43
          exit 0

      - name: Artefacts (aperçus, collecte, sortie du modèle)
        if: always() && steps.garde.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: brief-v22-${{ steps.garde.outputs.date_iso }}-${{ github.run_id }}
          path: /tmp/apercus/
          if-no-files-found: ignore

      - name: POST to daily-brief endpoint
        id: post
        if: steps.cycle.outputs.pret == '1' && steps.cycle.outputs.mode != 'apercu'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ steps.cycle.outputs.mode }}
          DATE_ISO: ${{ steps.cycle.outputs.date_iso }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: |
          set -eu
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET manquant"; exit 1; }
          if [ "$MODE" = "production" ] && git ls-remote --exit-code --tags origin "refs/tags/brief-envoye-$DATE_ISO" >/dev/null 2>&1; then
            echo "::error::Brief du $DATE_ISO déjà envoyé entre-temps : aucun doublon."; exit 1
          fi
          if [ "$MODE" = "essai" ]; then
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --rawfile bh /tmp/brief.html --arg te "$TEST_EMAIL" '{date:$date, brief_html:$bh, test_emails:[$te]}')
          else
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --rawfile bh /tmp/brief.html '{date:$date, brief_html:$bh}')
          fi
          response=$(curl -sSL -w "\n---HTTP_STATUS:%{http_code}---" -X POST "https://www.journaltrader360.fr/api/cron/daily-brief" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "$PAYLOAD" --max-time 180)
          body=$(echo "$response" | sed -e 's/---HTTP_STATUS:.*//')
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2 || true)
          echo "HTTP $status"; echo "$body" | head -c 3000; echo
          [ "$status" = "200" ] || { echo "::error::Endpoint daily-brief : $status"; exit 1; }
          dest=$(echo "$body" | grep -oE '"(recipients|destinataires)":[0-9]+' | head -1 | cut -d: -f2 || true)
          echo "dest=${dest:-?}" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "production" ]; then
            git tag "brief-envoye-$DATE_ISO" && git push -q origin "refs/tags/brief-envoye-$DATE_ISO" \
              || echo "::warning::étiquette brief-envoye-$DATE_ISO non posée (le garde anti-doublon ne la verra pas)"
          fi

      - name: Archiver le brief et la notion de culture
        id: archive
        # ══ POURQUOI CETTE ÉTAPE, ET POURQUOI ICI ══════════════════════════════
        #
        # Un brief ne vivait nulle part après son envoi. L'artefact du run est purgé
        # au bout de QUATORZE JOURS, et la seule copie durable était une boîte mail.
        # Cette étape en fait une page publique, et conserve au passage la prose de
        # la notion de culture du jour pour les articles du site.
        #
        # ⚠️ ELLE VIENT APRÈS L'ENVOI, ET C'EST UN CHANGEMENT DÉLIBÉRÉ PAR RAPPORT
        # À LA PR #106, qui archivait AVANT. L'archive AFFIRME « ce brief a été
        # envoyé aux membres le matin du … ». Archiver un brief que personne n'a
        # reçu ferait de cette page une affirmation fausse. Rien n'est perdu pour
        # autant : la rotation des notions est calculée sur la DATE, donc un envoi
        # raté ne consomme pas la notion, elle revient.
        #
        # ⛔ L'ARCHIVAGE NE DOIT JAMAIS EMPÊCHER UN BRIEF DE PARTIR. `continue-on-error`
        # garantit que le job reste vert : les soixante-seize destinataires passent
        # avant l'archive. Et de toute façon l'envoi a déjà eu lieu quand on arrive ici.
        #
        # ⚠️ MAIS L'ÉCHEC N'EST PAS SILENCIEUX POUR AUTANT, et c'est là que la #106
        # se trompait. Elle écrivait `node outils/archiver-culture.mjs … || exit 0`,
        # puis affirmait en commentaire que « l'étape ressort en rouge ». Avec
        # `|| exit 0` elle ne pouvait PAS ressortir en rouge : le step sortait en 0,
        # son `outcome` valait `success`, et un refus d'archivage se lisait comme une
        # réussite. Aucun `|| exit 0` ici. Le step échoue pour de bon, `outcome` vaut
        # `failure`, et l'étape Discord le lit et le dit.
        # ⛔ PAS D'ARCHIVAGE SUR UN ENVOI DE TEST. `test_email` et `only_user_id`
        # font partir le brief à une seule adresse, et l'endpoint répond 200 : la
        # condition « l'envoi a réussi » est donc vraie, et un essai manuel aurait
        # publié son brief sur le site. Ces deux entrées n'existent que sur
        # workflow_dispatch ; sur le cron, `github.event.inputs` est nul, et `!null`
        # vaut vrai — la condition laisse donc passer les vrais envois.
        # V22 : seul le mode « production » archive (ni essai, ni aperçu).
        if: >-
          always() && steps.post.outcome == 'success' && steps.cycle.outputs.mode == 'production'
        continue-on-error: true
        env:
          DATE_ISO: ${{ steps.cycle.outputs.date_iso }}
          DATE_LONG_FR: ${{ steps.cycle.outputs.date_long_fr }}
          SITE_TOKEN: ${{ secrets.SITE_ARCHIVE_TOKEN }}
        run: |
          set -u
          ECHECS=""
          FAIT=""
          note() { echo "$2" ; if [ "$1" = "ko" ]; then ECHECS="$ECHECS$2 | "; else FAIT="$FAIT$2 | "; fi; }

          git config --global user.name  "Archive Trader 360"
          git config --global user.email "clubtrader360@gmail.com"

          # ─── 1. LE BRIEF → DÉPÔT DU SITE ──────────────────────────────────────
          # Le site est un build Astro statique : le fichier doit être DANS son dépôt
          # au moment du build. On y écrit donc directement, plutôt que de déposer
          # sur une branche de données que le site irait chercher au build.
          #
          # ⚠️ Ce choix est celui du MODE DE PANNE. Un site qui récupère son contenu
          # par le réseau au moment du build produit, quand la récupération échoue,
          # un site VALIDE avec moins de briefs — et personne ne le remarque. Un
          # fichier commité, lui, est visible dans l'historique, relisible, et un
          # brief manquant se compte.
          # La cible — dépôt, branche, chemins — est lue dans outils/cible-archive.mjs,
          # LE MÊME fichier que celui qu'utilise le contrôleur de couverture. Deux
          # réponses différentes à « où va l'archive ? » produisent une panne verte :
          # on dépose là où rien ne rend, le contrôleur trouve le fichier, et la
          # notification annonce « à jour ». C'est arrivé, voir le commentaire de
          # cible-archive.mjs.
          CIBLE=$(node -e "
            import('./outils/cible-archive.mjs')
              .then(m => process.stdout.write([m.CIBLE.depot, m.CIBLE.branche, m.CIBLE.dossierBriefs, m.CIBLE.dossierRessources].join(' ')))
              .catch(e => { console.error(e.message); process.exit(1); })
          ")
          if [ -z "$CIBLE" ]; then
            echo "::error::Lecture de outils/cible-archive.mjs échouée. Rien n'est archivé."
            ECHECS="$ECHECS site: cible illisible | "
          fi
          set -- $CIBLE
          SITE_DEPOT="${1:-}"; SITE_BRANCHE="${2:-}"; SITE_BRIEFS="${3:-}"; SITE_RESS="${4:-}"

          if [ -z "${SITE_TOKEN:-}" ]; then
            echo "::error::SITE_ARCHIVE_TOKEN absent des secrets du dépôt. Le brief du $DATE_ISO n'est PAS archivé sur le site. Créer un jeton d'accès fin, portée « Contents: write » sur $SITE_DEPOT UNIQUEMENT, et l'enregistrer sous ce nom."
            ECHECS="$ECHECS site: jeton absent | "
          elif [ -n "$SITE_BRANCHE" ]; then
            rm -rf /tmp/site
            # ⚠️ `--branch` EXPLICITE. Sans lui, git clone la branche par DÉFAUT du
            # dépôt du site, qui n'est pas celle où vit la structure d'accueil de
            # l'archive. Le brief atterrissait sur `main`, où aucune page ne le rend.
            if git clone --depth=1 --quiet --branch "$SITE_BRANCHE" \
                 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_DEPOT}.git" /tmp/site; then

              # ⚠️ LES DÉPENDANCES, INSTALLÉES ICI ET NULLE PART AILLEURS.
              # `api/cron/daily-brief.js` importe `@supabase/supabase-js`, et sa chaîne
              # d'import traverse `sheets-client.js` qui tire `googleapis`. Or ce
              # workflow n'installait QUE la CLI Claude : au premier passage réel, le
              # 6 puis le 7 octobre, l'archivage du site a échoué sur
              # « Cannot find package '@supabase/supabase-js' ».
              #
              # ⚠️ POURQUOI AUCUNE RÉPÉTITION NE L'AVAIT VU : elles tournaient en
              # local, où `node_modules` existe. Le contrôle C de
              # verifier-archive-brief.mjs comparait fidèlement les deux chemins — et
              # les deux marchaient, chez moi. « Ça marche en local » n'est pas une
              # mesure de la CI.
              #
              # L'installation est DANS cette étape, et pas en étape séparée plus haut :
              # une étape autonome qui échoue ferait tomber le job AVANT l'envoi. Ici,
              # `continue-on-error` couvre tout, donc rien ne peut retenir le brief.
              if ! npm ci --no-audit --no-fund --silent 2>/tmp/npm.log; then
                echo "::warning::npm ci a échoué :"; tail -5 /tmp/npm.log
                note ko "site: dépendances non installées"
                cd "$GITHUB_WORKSPACE"
                RC=1
              else
                RC=0
              fi

              # ══ RECONSTRUIRE LE COURRIEL RÉELLEMENT ENVOYÉ ═══════════════════
              # ⚠️ /tmp/brief.html N'EST PAS LE COURRIEL. C'est le CORPS seul, extrait
              # de la sortie du modèle au `<div class="brief-marche">`. L'enveloppe —
              # fond crème, carte à 600 px, bandeau, pied — est posée bien plus tard,
              # par `wrapBriefHtml()` dans l'endpoint, au moment de l'envoi.
              #
              # Archiver /tmp/brief.html tel quel aurait produit un brief sans bandeau
              # ni carte : un artefact DIFFÉRENT de celui du rattrapage, alors que
              # toute la conception tient à ce que les deux chemins passent par la
              # même routine sur la même forme d'entrée. Le défaut ne se serait vu
              # qu'au premier envoi réel, sur la page publiée.
              #
              # On rejoue donc la chaîne de l'endpoint, avec SES fonctions et dans
              # SON ordre : stripLongDashes, puis ajouterPivots, puis stripAuditComment, puis
              # wrapBriefHtml. Pas de réimplémentation : une deuxième version du
              # gabarit finirait par diverger de celle qui part aux élèves.
              # `firstName: null` rend « Bonjour, » plutôt qu'un prénom ; la routine
              # d'archivage retire cette ligne dans les deux cas.
              if [ $RC -eq 0 ] && ! node -e "
                Promise.all([import('./api/cron/daily-brief.js'), import('node:fs')])
                  .then(([m, fs]) => {
                    let h = fs.readFileSync('/tmp/brief.html', 'utf8');
                    h = m.stripLongDashes(h).html;
                    h = m.ajouterPivots(h).html;
                    h = m.stripAuditComment(h).html;
                    fs.writeFileSync('/tmp/courriel.html', m.wrapBriefHtml({
                      firstName: null,
                      dateLongFr: process.env.DATE_LONG_FR,
                      briefHtml: h,
                      // V22 : variante « archive » (ni désinscription, ni pied réseaux).
                      variant: 'archive',
                    }));
                  })
                  .catch((e) => { console.error(e.message); process.exit(1); });
              "; then
                note ko "site: reconstruction du courriel impossible"
                cd "$GITHUB_WORKSPACE"
                RC=1
              else
                RC=0
              fi

              # ⚠️ PAS DE `if node … | tee …; then`. Un `if` sur un pipeline teste le
              # code de sortie de la DERNIÈRE commande — `tee`, qui réussit toujours.
              # Le refus d'archivage serait passé pour une réussite. Ce piège a déjà
              # coûté un faux « ✅ envoyé » dans ce même workflow.
              if [ $RC -eq 0 ]; then
                node outils/archiver-brief.mjs /tmp/courriel.html "$DATE_ISO" "/tmp/site/$SITE_BRIEFS" \
                  > /tmp/archive.log 2>&1
                RC=$?
                cat /tmp/archive.log
              fi

              if [ $RC -eq 0 ]; then
                # Les fichiers du courriel — bandeau, logo, schéma de culture — sont
                # servis par le SITE et non par journaltrader360.fr, dont le sort
                # n'est pas tranché. La routine annonce ceux dont ce brief a besoin,
                # une ligne « RESSOURCE <chemin> » chacun : on ne redevine pas la
                # liste ici. Le bandeau est versionné (-v2, -v3…) et un grep écrit à
                # la main sur « culture/ » l'aurait manqué à chaque changement.
                MANQUE=0
                while IFS= read -r CHEMIN; do
                  [ -z "$CHEMIN" ] && continue
                  DEST="/tmp/site/$SITE_RESS/$CHEMIN"
                  [ -f "$DEST" ] && continue
                  mkdir -p "$(dirname "$DEST")"
                  # -L est indispensable : le domaine répond 308 sans lui, et curl
                  # écrirait quinze octets de redirection dans un fichier .png.
                  curl -sSL --max-time 30 -o "$DEST" "https://journaltrader360.fr/assets/$CHEMIN" || true
                  case "$(file -b --mime-type "$DEST" 2>/dev/null)" in
                    image/*) echo "   fichier du courriel récupéré : $CHEMIN" ;;
                    *) rm -f "$DEST"; MANQUE=$((MANQUE + 1))
                       echo "::warning::Fichier « $CHEMIN » non récupéré — l'archive du jour s'affichera sans lui." ;;
                  esac
                done < <(sed -n 's/^RESSOURCE //p' /tmp/archive.log)

                cd /tmp/site
                git add "$SITE_BRIEFS" "$SITE_RESS" 2>/dev/null || git add "$SITE_BRIEFS"
                if git diff --cached --quiet; then
                  note ok "site: déjà archivé"
                elif git commit -qm "archive : brief du $DATE_ISO" && git push -q origin "HEAD:$SITE_BRANCHE"; then
                  note ok "site: brief du $DATE_ISO publié sur $SITE_BRANCHE$([ "$MANQUE" -gt 0 ] && echo " ($MANQUE fichier(s) manquant(s))")"
                else
                  note ko "site: commit ou push refusé"
                fi
                cd "$GITHUB_WORKSPACE"
              else
                note ko "site: nettoyage refusé (voir ::error:: ci-dessus)"
              fi
            else
              note ko "site: clone de $SITE_BRANCHE impossible (branche absente, jeton expiré, ou portée insuffisante ?)"
            fi
          fi

          # ─── 2. LA NOTION DE CULTURE → BRANCHE donnees-culture ────────────────
          # Retour au dépôt courant, quoi qu'il se soit passé au-dessus. Le bloc
          # précédent fait un `cd /tmp/site`, et tous ses chemins de sortie repassent
          # bien ici — mais « tous les chemins repassent bien ici » est le genre
          # d'affirmation qu'un ajout futur rend fausse sans rien casser tout de suite.
          cd "$GITHUB_WORKSPACE"
          # Un fichier par NOTION, pas par date : c'est ce qui sert à écrire les
          # articles du site. L'archive des briefs, elle, est chronologique. Les deux
          # ne font donc pas double emploi.
          if node outils/archiver-culture.mjs /tmp/brief.html /tmp/culture "$DATE_ISO"; then
            if [ -z "$(ls -A /tmp/culture 2>/dev/null)" ]; then
              note ok "culture: aucune notion ce jour"
            else
              # Même motif que marche-cloture.yml, qui écrit sur `donnees-marche`
              # depuis des mois : c'est le seul écrivain de branche de données dont
              # on sache qu'il fonctionne en production.
              if git fetch origin donnees-culture --depth=1 2>/dev/null && git checkout -q donnees-culture; then :;
              else git checkout -q --orphan donnees-culture && git rm -rq --cached . 2>/dev/null || true; fi
              mkdir -p textes && cp /tmp/culture/*.md textes/ && git add textes
              if git diff --cached --quiet; then
                note ok "culture: texte identique, rien à écrire"
              elif git commit -qm "archive : notion du $DATE_ISO" && git push -q origin donnees-culture; then
                note ok "culture: $(ls /tmp/culture | tr '\n' ' ')archivée"
              else
                note ko "culture: commit ou push refusé"
              fi
            fi
          else
            note ko "culture: extraction refusée (voir ::error:: ci-dessus)"
          fi

          # ─── 3. VERDICT ───────────────────────────────────────────────────────
          # Écrit AVANT le exit : les sorties d'un step qui échoue restent lisibles
          # par les steps suivants, et c'est l'étape Discord qui en a besoin.
          {
            echo "fait=${FAIT:-rien}"
            echo "echecs=${ECHECS:-aucun}"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$ECHECS" ]; then
            echo "::error::Archivage incomplet : $ECHECS"
            exit 1
          fi
          echo "✅ Archivage complet : $FAIT"


      - name: Notify Discord
        if: always() && steps.garde.outputs.go == '1' && steps.cycle.outputs.mode == 'production' && steps.cycle.outputs.relance != '1'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CRON_WEBHOOK_URL }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          DATE_LONG_FR: ${{ steps.cycle.outputs.date_long_fr }}
          DEST: ${{ steps.post.outputs.dest }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          ARCHIVE_FAIT: ${{ steps.archive.outputs.fait }}
          ARCHIVE_ECHECS: ${{ steps.archive.outputs.echecs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          if [ "$POST_OUTCOME" = "success" ]; then
            if [ "$ARCHIVE_OUTCOME" = "success" ]; then ARCH="✅ ${ARCHIVE_FAIT:-déposé}"; COLOR=13938487; else ARCH="❌ ${ARCHIVE_ECHECS:-archivage non fait}"; COLOR=15680580; fi
            PAYLOAD=$(jq -n --argjson c "$COLOR" --arg date "$DATE_LONG_FR" --arg dest "${DEST:-?}" --arg arch "$(echo "$ARCH" | cut -c1-500)" --arg url "$RUN_URL" \
              '{embeds:[{title:"📊 Brief v22 envoyé",color:$c,fields:[{name:"Date",value:$date,inline:true},{name:"Destinataires",value:$dest,inline:true},{name:"Données de marché",value:"✅ toutes les valeurs confirmées par deux sources",inline:false},{name:"Archive",value:$arch,inline:false},{name:"Run",value:("[Voir le run](\($url))"),inline:false}],timestamp:(now|todate)}]}')
          else
            PAYLOAD=$(jq -n --arg date "$DATE_LONG_FR" --arg url "$RUN_URL" \
              '{embeds:[{title:"❌ Brief v22 NON envoyé",color:15680580,description:("Brief du \($date). [Voir le run](\($url))"),timestamp:(now|todate)}]}')
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Brief v22"
            echo "- Mode : ${{ steps.cycle.outputs.mode || steps.garde.outputs.mode || 'aucun' }}"
            echo "- Date : ${{ steps.garde.outputs.date_long_fr }}"
            echo "- Envoi : ${{ steps.post.outcome || 'aucun' }}"
            echo "- Statut : ${{ job.status }}"
            [ -f /tmp/apercus/collecte-${{ steps.garde.outputs.date_iso }}.txt ] && { echo '```'; cat /tmp/apercus/collecte-${{ steps.garde.outputs.date_iso }}.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
