name: Daily Brief Trader 360

on:
  schedule:
    # Cron 43 22 * * 0-4 :
    # - Été CEST (UTC+2) : 22h43 UTC = 00h43 Paris (nuit dim→jeu), arrivée typique 1h-2h, worst case 5h
    # - Hiver CET (UTC+1) : 22h43 UTC = 23h43 Paris (veille), arrivée typique 00h-1h, worst case 4h
    # → Aucun ajustement nécessaire au passage d'heure. Toujours avant 6h Paris.
    # Minute non-ronde (43) : évite la queue GitHub Actions des crons à minute ronde (lag jusqu'à 3-4h).
    - cron: '43 22 * * 0-4'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du test manuel (log)'
        required: false
        default: 'Test manuel'
      only_user_id:
        description: 'UUID élève cible (test ciblé — vide = TOUS les éligibles)'
        required: false
        default: ''
      test_email:
        description: 'Email de test : envoi UNIQUEMENT à cette adresse (prioritaire sur only_user_id, zéro élève touché)'
        required: false
        default: ''
      test_subject_suffix:
        description: "Suffixe de sujet, pour sortir du fil Gmail d'un envoi précédent. Branche jetable uniquement."
        required: false
        default: ''

# L'archivage écrit sur la branche de données `donnees-culture` du dépôt, d'où ce
# droit. Il reste minimal : rien d'autre dans ce workflow n'écrit dans le dépôt.
# L'écriture dans le dépôt du SITE, elle, ne passe pas par ce jeton mais par
# SITE_ARCHIVE_TOKEN : le GITHUB_TOKEN d'un run ne vaut que pour son propre dépôt.
permissions:
  contents: write

jobs:
  generate-and-send-brief:
    name: Génère le brief (Claude Code CLI) et l'envoie
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate brief HTML via Claude
        id: brief
        timeout-minutes: 25   # sous le job (30) → le step rate proprement avant la coupe brutale GH
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN manquant dans les Secrets GitHub (à générer via 'claude setup-token', lié à l'abo Claude Max)."
            exit 1
          fi

          DATE_ISO=$(TZ=Europe/Paris date +%Y-%m-%d)
          DOW=$(TZ=Europe/Paris date +%u)   # 1=Lun … 7=Dim (rotation encart Ambassadeur)

          # Date longue formatée par api/_lib/date-fr.js, la MÊME fonction que celle
          # qu'utilise l'endpoint. Elle n'est pas recopiée ici : une deuxième
          # implémentation finirait par diverger de la première.
          #
          # L'ancienne ligne était :
          #   LC_TIME=fr_FR.UTF-8 date +"%A %-d %B %Y" 2>/dev/null || TZ=... date ...
          # Elle a produit « Thursday 3 September 2026 » pendant des jours. La locale
          # fr_FR n'est pas installée sur le runner, mais `date` ne plante pas pour
          # autant : il sort en anglais avec un code de retour 0, si bien que le repli
          # `||` ne pouvait JAMAIS se déclencher. Pas de sortie non nulle, pas d'alerte.
          # `set -e` ne pouvait rien voir non plus.
          DATE_LONG_FR=$(node -e "
            import('./api/_lib/date-fr.js')
              .then(m => process.stdout.write(m.formatDateLongFr('$DATE_ISO')))
              .catch(e => { console.error(e.message); process.exit(1); })
          ")
          # Ce garde-là, LUI, peut se déclencher : node sort en code 1 sur une erreur
          # d'import ou une date invalide, et la variable est alors vide.
          if [ -z "$DATE_LONG_FR" ]; then
            echo "::error::Formatage de la date échoué pour $DATE_ISO (api/_lib/date-fr.js)."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.test_subject_suffix }}" ]; then
            DATE_LONG_FR="$DATE_LONG_FR ${{ github.event.inputs.test_subject_suffix }}"
          fi
          echo "📅 Brief du $DATE_LONG_FR ($DATE_ISO) · jour $DOW"

          # NOTION DE CULTURE DU JOUR. La rotation est calculée par api/_lib/culture-marche.js,
          # la MÊME fonction que celle qu'utilise l'endpoint pour journaliser et vérifier.
          # Elle n'est pas recopiée ici : deux implémentations de la rotation finiraient par
          # diverger, et le brief publierait une définition du MACD sous un schéma de RSI.
          # Une notion dont le schéma n'est pas encore dessiné rend une ligne « aucune » :
          # la rubrique saute ce jour-là, elle ne part pas avec une image manquante.
          CULTURE=$(node -e "
            import('./api/_lib/culture-marche.js')
              .then(m => {
                const n = m.notionDuJour('$DATE_ISO');
                process.stdout.write(n
                  ? 'Notion de culture du jour : ' + n.nom + ' (rotation ' + n.rang + ', catalogue ' + n.rangCatalogue + '). Angle a traiter : ' + n.angle + '. Adresse du schema, a reprendre TELLE QUELLE : ' + n.urlSchema
                  : 'Aucune notion de culture aujourd hui : ne produis pas la section 8.');
              })
              .catch(e => { console.error(e.message); process.exit(1); })
          ")
          if [ -z "$CULTURE" ]; then
            echo "::error::Rotation culture échouée pour $DATE_ISO (api/_lib/culture-marche.js)."
            exit 1
          fi
          echo "📚 $CULTURE"

          # ═══ DONNÉES DE MARCHÉ COLLECTÉES PAR DU CODE ═══════════════════════════
          #
          # Jusqu'ici TOUS les chiffres du brief venaient du modèle, via WebSearch et
          # WebFetch. Un modèle qui lit une page rend toujours une valeur plausible :
          # mauvais champ, page modifiée, contrat qui vient de rouler, il ne plante pas,
          # il produit un nombre crédible. Sur les dix derniers runs de production, la
          # clôture ES est sortie en n/d cinq fois et fausse au moins deux fois — le
          # 14/09 sur le contrat périmé ESU26, à soixante-huit points de la réalité.
          #
          # Le code, lui, échoue bruyamment. Une valeur qui rate un contrôle devient
          # n/d avec son motif, et le motif part dans l'audit ET dans Discord.
          #
          # L'historique des instantanés est récupéré s'il existe : il porte le haut et
          # le bas des séances réglées, que rien ne peut donner à l'heure du brief.
          # Les instantanés sont EXTRAITS, pas seulement récupérés. La version
          # précédente faisait un `git fetch` puis imprimait une ligne de log
          # rassurante, et personne ne lisait les fichiers : `collecterMarche` accepte
          # un paramètre `historique` qu'aucun appelant ne remplissait. Les hauts et
          # bas d'ES seraient restés en n/d indéfiniment.
          INSTANTANES=""
          if git fetch origin donnees-marche --depth=30 2>/dev/null \
             && git archive origin/donnees-marche seances 2>/dev/null | tar -x -C /tmp; then
            INSTANTANES=/tmp/seances
            echo "📈 Instantanés extraits : $(ls -1 $INSTANTANES 2>/dev/null | wc -l | tr -d ' ') séance(s)"
            ls -1 "$INSTANTANES" 2>/dev/null | tail -6 | sed 's/^/     /'
          else
            echo "📈 Aucun instantané déposé — hauts et bas d'ES en n/d, le reste du tableau n'en dépend pas"
          fi

          MARCHE=$(node outils/marche.mjs collecte "$DATE_ISO" "$INSTANTANES" 2>/tmp/marche_err.log)
          if [ -z "$MARCHE" ]; then
            echo "::error::La collecte de marché n'a rien produit. $(cat /tmp/marche_err.log)"
            exit 1
          fi
          echo "$MARCHE"

          # Nombre de valeurs indisponibles, pour l'alerte Discord. Compté sur la
          # sortie réellement injectée, pas sur une intention.
          ND=$(echo "$MARCHE" | grep -c ' : n/d (' || true)
          echo "marche_nd=$ND" >> "$GITHUB_OUTPUT"
          {
            echo 'marche_motifs<<FIN'
            echo "$MARCHE" | grep ' : n/d (' | sed 's/^ *//' | head -12
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"
          if [ "$ND" -gt 0 ]; then
            echo "::warning::$ND valeur(s) de marché indisponibles — elles partiront en n/d."
          fi

          # Contexte daté injecté en tête (évite que Claude devine la date).
          PROMPT="$(printf 'Date du jour (Europe/Paris) : %s (%s). Jour de semaine (1=Lun … 5=Ven) : %s.\n%s\n\n%s\n\n%s' \
            "$DATE_LONG_FR" "$DATE_ISO" "$DOW" "$CULTURE" "$MARCHE" "$(cat .github/workflows/prompts/daily-brief-system.md)")"

          echo "🤖 Claude Code CLI version : $(claude --version 2>&1 || echo 'inconnue')"
          echo "📝 Prompt système : $(wc -l < .github/workflows/prompts/daily-brief-system.md) lignes, $(wc -c < .github/workflows/prompts/daily-brief-system.md) octets"

          # Génération headless. --dangerously-skip-permissions : autorise WebSearch/WebFetch + Bash en CI.
          # On capture stdout (brief_raw.html) ET stderr (claude_err.log) séparément, sans exit immédiat,
          # pour TOUJOURS pouvoir afficher la vraie cause d'un échec (le 1er run a fail en silence).
          set +e
          echo "$PROMPT" | claude -p --output-format text --dangerously-skip-permissions \
            > /tmp/brief_raw.html 2>/tmp/claude_err.log
          EXIT_CODE=$?
          set -e

          # stderr affiché systématiquement (warnings utiles même en cas de succès).
          echo "---START STDERR---"
          cat /tmp/claude_err.log 2>/dev/null || true
          echo "---END STDERR---"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Claude CLI a échoué (exit code $EXIT_CODE)."
            echo "---START STDOUT (100 premières lignes) ---"
            head -100 /tmp/brief_raw.html 2>/dev/null || true
            echo "---END STDOUT---"
            echo "::error::Causes fréquentes : token invalide/incomplet · quota Claude Max épuisé (rate limit) · WebFetch/WebSearch refusés en CI · prompt trop long. Voir STDERR/STDOUT ci-dessus."
            exit 1
          fi

          # === VALIDATION STRICTE ANTI-MÉTA-COMMENTAIRE (bug prod P1) ===
          # 1. Extraction robuste : tout depuis la div wrapper 'brief-marche' jusqu'à la FIN.
          #    Pardonne un préambule méta AVANT le vrai HTML (Claude a parfois bavardé) en le
          #    coupant. On va jusqu'à EOF (pas au 1er </div>) car le brief contient des <div>
          #    imbriqués (encarts) → s'arrêter au 1er </div> tronquait le brief.
          #    Si le marqueur est absent → /tmp/brief.html vide → échec (pas de mail cassé).
          #
          #    Le motif tolère les ATTRIBUTS sur la balise wrapper. L'ancien motif exigeait
          #    '<div class="brief-marche">' avec le '>' collé : le run du 2026-08-21 a produit
          #    '<div class="brief-marche" style="font-family:Arial;…">' — brief parfaitement
          #    valide, rejeté à tort, aucun mail envoyé. Le prompt réclame des styles inline
          #    partout (compat email), donc un attribut sur le wrapper est une variation
          #    normale du modèle, pas une anomalie. Couvre aussi class en quotes simples et
          #    l'ordre inverse des attributs.
          sed -n '/<div[^>]*brief-marche/,$p' /tmp/brief_raw.html > /tmp/brief.html

          if [ ! -s /tmp/brief.html ]; then
            echo "::error::Wrapper <div ... class=\"brief-marche\"> introuvable dans la sortie Claude. Rien n'est envoyé. Vérifier le STDOUT ci-dessous : soit Claude n'a produit que du méta-commentaire, soit il a renommé/omis le wrapper."
            echo "---START STDOUT (100 lignes) ---"; head -100 /tmp/brief_raw.html 2>/dev/null || true; echo "---END STDOUT---"
            exit 1
          fi

          SIZE=$(wc -c < /tmp/brief.html)
          # 2a. Taille minimale plausible d'un vrai brief.
          if [ "$SIZE" -lt 3000 ]; then
            echo "::error::HTML extrait trop court ($SIZE octets < 3000) — probablement incomplet ou méta. Rien n'est envoyé."
            echo "---START HTML---"; cat /tmp/brief.html; echo "---END HTML---"
            exit 1
          fi
          # 2b. Double-check du marqueur (l'extraction le garantit, ceinture + bretelles).
          if ! grep -q 'brief-marche' /tmp/brief.html; then
            echo "::error::Marqueur 'brief-marche' absent après extraction. Rien n'est envoyé."; exit 1
          fi
          # 2c. Ne doit pas COMMENCER par du texte méta (1re ligne non vide, casse ignorée).
          FIRST=$(grep -m1 -v '^[[:space:]]*$' /tmp/brief.html || true)
          if echo "$FIRST" | grep -qiE '^[[:space:]]*(le brief|voici|j.ai|points cl|sauvegard|le fichier)'; then
            echo "::error::Le HTML commence par un méta-commentaire : $FIRST — Rien n'est envoyé."; exit 1
          fi
          # 2d. Doit commencer par une balise HTML valide.
          if ! echo "$FIRST" | grep -qiE '^[[:space:]]*<(!doctype|html|div|article|section)'; then
            echo "::error::Le HTML ne commence pas par une balise valide (<!DOCTYPE/<html/<div/<article/<section) : $FIRST — Rien n'est envoyé."; exit 1
          fi

          echo "✅ HTML validé ($SIZE octets)"

          # === RELEVÉ DE STRUCTURE ===
          # Le HTML produit n'était imprimé qu'en cas d'ÉCHEC. Sur un run réussi on ne
          # voyait donc que sa taille : impossible de constater qu'une section attendue
          # est là, et impossible de voir ce que lit quelqu'un dont le client masque les
          # images. Ce relevé coûte quelques lignes de log et répond aux deux.
          compter() { grep -o "$1" /tmp/brief.html 2>/dev/null | wc -l | tr -d ' '; }
          echo "📐 Structure du brief :"
          echo "   tableau SPX (en-tête ES/CFD) ......... $(compter '>ES<')/$(compter '>CFD<')"
          echo "   lignes du tableau (HAUT SEM.) ........ $(compter 'HAUT SEM\.')"
          echo "   niveaux psychologiques ............... $(compter 'Niveaux psychologiques')"
          echo "   encart culture ....................... $(compter 'Culture de march')"
          echo "   schéma référencé ..................... $(grep -o 'assets/culture/[a-z0-9-]*\.png' /tmp/brief.html | sort -u | tr '\n' ' ')"
          echo "   attribut alt du schéma ............... $(grep -o 'alt="Schéma[^"]*"' /tmp/brief.html | head -1)"
          echo "   tirets longs restants ................ $(compter '[—–]')"
          echo "   poids ................................ $SIZE octets ($(( SIZE * 100 / 92160 ))% de la garde des 90 Ko)"

          # === LE MODÈLE A-T-IL REPRIS LES CHIFFRES TELS QUELS ? ===
          # Le prompt le lui interdit ; cette vérification ne fait pas confiance au
          # prompt. Trois durcissements successifs des instructions n'ont rien changé
          # au problème, ce qui est la raison même de cette refonte : une consigne
          # n'est pas un contrôle. Chaque valeur FOURNIE est cherchée dans le HTML
          # produit, au format français, telle qu'elle a été transmise.
          echo "🔢 Reprise des chiffres fournis :"
          MANQUANTS=0
          while IFS= read -r ligne; do
            # Découpage sur le PREMIER deux-points, pas le dernier. Avec `.* : ` le
            # motif est glouton : sur « haut de semaine : n/d (… clôtures : le fichier
            # Cboe …) » il coupait au deux-points du MOTIF, la valeur devenait un bout
            # de phrase, le test « commence par n/d » ne la reconnaissait plus, et la
            # ligne repartait dans la comparaison. Elle y passait, parce que la
            # réduction aux chiffres rendait une chaîne VIDE et que `grep -F ""` trouve
            # toujours. Deux n/d comptés comme vérifiés : un faux ✅ est pire qu'une
            # absence de contrôle, puisqu'il affirme.
            libelle=$(echo "$ligne" | sed 's/^ *//; s/ *:.*//')
            valeur=$(echo "$ligne" | sed 's/^[^:]*: *//')
            case "$valeur" in n/d*) continue;; esac
            # L'espace fine insécable des milliers peut être rendu par plusieurs
            # caractères selon le modèle : la comparaison porte sur les chiffres seuls.
            chiffres=$(echo "$valeur" | sed 's/[^0-9,]//g')
            if [ -z "$chiffres" ]; then
              echo "   ❌ $libelle — valeur « $valeur » sans chiffre, non vérifiable"
              MANQUANTS=$((MANQUANTS + 1))
            elif grep -qF "$chiffres" <(sed 's/[^0-9,]//g' /tmp/brief.html); then
              echo "   ✅ $libelle = $valeur"
            else
              echo "   ❌ $libelle = $valeur — ABSENTE du brief"
              MANQUANTS=$((MANQUANTS + 1))
            fi
          done < <(echo "$MARCHE" | grep -E '^  .+ : ')
          echo "marche_manquants=$MANQUANTS" >> "$GITHUB_OUTPUT"
          if [ "$MANQUANTS" -gt 0 ]; then
            echo "::warning::$MANQUANTS valeur(s) fournie(s) n'apparaissent pas telles quelles dans le brief — le modèle les a modifiées ou omises."
          fi

          echo "date_iso=$DATE_ISO" >> "$GITHUB_OUTPUT"
          echo "date_long_fr=$DATE_LONG_FR" >> "$GITHUB_OUTPUT"

      - name: Archiver le HTML produit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-html-${{ steps.brief.outputs.date_iso || github.run_id }}
          path: /tmp/brief.html
          retention-days: 14
          if-no-files-found: warn

      - name: POST to daily-brief endpoint
        id: post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY_USER_ID: ${{ github.event.inputs.only_user_id }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          REASON: ${{ github.event.inputs.reason || 'cron auto' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant côté GitHub."
            exit 1
          fi
          DATE_ISO="${{ steps.brief.outputs.date_iso }}"

          # Validation UUID si only_user_id fourni (anti-injection).
          if [ -n "$ONLY_USER_ID" ] && ! echo "$ONLY_USER_ID" | grep -qiE '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'; then
            echo "::error::only_user_id invalide (UUID attendu) : '$ONLY_USER_ID'"
            exit 1
          fi

          # Construction du body JSON (jq gère l'échappement du HTML).
          if [ -n "$TEST_EMAIL" ]; then
            echo "🧪 Test email ciblé : $TEST_EMAIL (aucun élève réel touché)"
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --rawfile bh /tmp/brief.html --arg te "$TEST_EMAIL" \
              '{date:$date, brief_html:$bh, test_emails:[$te]}')
          elif [ -n "$ONLY_USER_ID" ]; then
            echo "🎯 Test ciblé élève : $ONLY_USER_ID"
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --rawfile bh /tmp/brief.html --arg uid "$ONLY_USER_ID" \
              '{date:$date, brief_html:$bh, only_user_id:$uid}')
          else
            echo "🚀 Envoi à TOUS les éligibles (raison: $REASON)"
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --rawfile bh /tmp/brief.html \
              '{date:$date, brief_html:$bh}')
          fi

          response=$(curl -sSL -w "\n---HTTP_STATUS:%{http_code}---" -X POST \
            "https://www.journaltrader360.fr/api/cron/daily-brief" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 180 \
            --retry 2 --retry-delay 10)

          body=$(echo "$response" | sed -e 's/---HTTP_STATUS:.*//')
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          echo "HTTP Status: $status"
          echo "Response body:"; echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Endpoint daily-brief a répondu $status (attendu 200). Body ci-dessus."
            exit 1
          fi

          # Le repli est SORTI du pipeline, il n'y est plus en queue.
          # `a | b | c || repli` teste le code de sortie de c seulement. Ici c'était
          # `cut`, qui réussit sur une entrée vide en ne produisant rien : le repli ne
          # se déclenchait jamais et la variable devenait une chaîne VIDE, pas « ? ».
          # Conséquence mesurée sur une réponse inattendue : le log affichait
          # « ✅  envoyé(s) ·  échec(s) », et Discord affichait « 0 / 0 » à cause du
          # `${x:-0}` plus bas — soit une affirmation fausse et confiante là où la
          # vérité est « on ne sait pas ».
          sent=$(echo "$body" | grep -oE '"sent":[0-9]+' | head -1 | cut -d: -f2)
          failed=$(echo "$body" | grep -oE '"failed":[0-9]+' | head -1 | cut -d: -f2)
          dest=$(echo "$body" | grep -oE '"destinataires":[0-9]+' | head -1 | cut -d: -f2)

          # ⚠️ REPLI POUR LE MODE BREVO. En campagne, la réponse ne porte NI « sent »
          # NI « destinataires » : elle porte « recipients ». Les trois compteurs
          # sortaient donc en « ? » alors que 88 personnes avaient reçu le brief, les
          # 6 et 7 octobre. La notification disait « ? / ? » — honnête, puisqu'elle
          # refuse d'affirmer un zéro faux, mais aveugle au mode réellement utilisé.
          #
          # ⛔ LE MOTIF RESTE `"sent":[0-9]+`, AVEC LES CHIFFRES. La réponse porte
          # aussi `"sent":true`, un BOOLÉEN, pour la campagne prospects : un motif
          # élargi à `"sent":\w+` rendrait « true » et l'afficherait comme un nombre
          # d'envois. Vérifié sur le corps réel du 7 octobre.
          #
          # Le repli est SORTI du pipeline, comme les autres dans ce fichier : testé en
          # queue, `a | b | c || repli` ne regarde que le code de sortie de `c`.
          if [ -z "$sent" ]; then
            sent=$(echo "$body" | grep -oE '"recipients":[0-9]+' | head -1 | cut -d: -f2)
          fi
          if [ -z "$dest" ]; then
            dest=$(echo "$body" | grep -oE '"recipients":[0-9]+' | head -1 | cut -d: -f2)
          fi

          # Ce qui reste vide reste « ? » : en mode Brevo il n'y a pas de compteur
          # d'échecs par destinataire, et « 0 échec » serait une affirmation qu'on ne
          # peut pas soutenir.
          sent=${sent:-?}
          failed=${failed:-?}
          dest=${dest:-?}
          echo "✅ $sent envoyé(s) · $failed échec(s) · $dest destinataire(s)"

          # Test arithmétique, et non textuel. L'ancienne condition était
          # `[ "${failed:-0}" != "0" ] && [ -n "${failed}" ]` : elle marchait tant que
          # `failed` était vide, mais devient FAUSSE dès que la valeur vaut « ? », car
          # « ? » est différent de « 0 » et non vide. Corriger l'extraction sans
          # corriger ce test aurait donc introduit un faux avertissement à chaque
          # réponse inattendue. `-gt` échoue proprement sur du non-numérique, et la
          # redirection d'erreur évite le message « integer expression expected ».
          if [ "$failed" -gt 0 ] 2>/dev/null; then
            echo "::warning::$failed mail(s) ont échoué côté Resend. Voir le JSON ci-dessus."
          fi

          # Expose les compteurs au step de notif Discord. Plus de `${x:-0}` : les
          # variables sont désormais toujours renseignées, et surtout ce défaut-là
          # transformait un « inconnu » en « 0 », ce qui est le contraire du but.
          { echo "sent=$sent"; echo "failed=$failed"; echo "dest=$dest"; } >> "$GITHUB_OUTPUT"

      - name: Archiver le brief et la notion de culture
        id: archive
        # ══ POURQUOI CETTE ÉTAPE, ET POURQUOI ICI ══════════════════════════════
        #
        # Un brief ne vivait nulle part après son envoi. L'artefact du run est purgé
        # au bout de QUATORZE JOURS, et la seule copie durable était une boîte mail.
        # Cette étape en fait une page publique, et conserve au passage la prose de
        # la notion de culture du jour pour les articles du site.
        #
        # ⚠️ ELLE VIENT APRÈS L'ENVOI, ET C'EST UN CHANGEMENT DÉLIBÉRÉ PAR RAPPORT
        # À LA PR #106, qui archivait AVANT. L'archive AFFIRME « ce brief a été
        # envoyé aux membres le matin du … ». Archiver un brief que personne n'a
        # reçu ferait de cette page une affirmation fausse. Rien n'est perdu pour
        # autant : la rotation des notions est calculée sur la DATE, donc un envoi
        # raté ne consomme pas la notion, elle revient.
        #
        # ⛔ L'ARCHIVAGE NE DOIT JAMAIS EMPÊCHER UN BRIEF DE PARTIR. `continue-on-error`
        # garantit que le job reste vert : les soixante-seize destinataires passent
        # avant l'archive. Et de toute façon l'envoi a déjà eu lieu quand on arrive ici.
        #
        # ⚠️ MAIS L'ÉCHEC N'EST PAS SILENCIEUX POUR AUTANT, et c'est là que la #106
        # se trompait. Elle écrivait `node outils/archiver-culture.mjs … || exit 0`,
        # puis affirmait en commentaire que « l'étape ressort en rouge ». Avec
        # `|| exit 0` elle ne pouvait PAS ressortir en rouge : le step sortait en 0,
        # son `outcome` valait `success`, et un refus d'archivage se lisait comme une
        # réussite. Aucun `|| exit 0` ici. Le step échoue pour de bon, `outcome` vaut
        # `failure`, et l'étape Discord le lit et le dit.
        # ⛔ PAS D'ARCHIVAGE SUR UN ENVOI DE TEST. `test_email` et `only_user_id`
        # font partir le brief à une seule adresse, et l'endpoint répond 200 : la
        # condition « l'envoi a réussi » est donc vraie, et un essai manuel aurait
        # publié son brief sur le site. Ces deux entrées n'existent que sur
        # workflow_dispatch ; sur le cron, `github.event.inputs` est nul, et `!null`
        # vaut vrai — la condition laisse donc passer les vrais envois.
        if: >-
          always() && steps.post.outcome == 'success'
          && !github.event.inputs.test_email && !github.event.inputs.only_user_id
        continue-on-error: true
        env:
          DATE_ISO: ${{ steps.brief.outputs.date_iso }}
          DATE_LONG_FR: ${{ steps.brief.outputs.date_long_fr }}
          SITE_TOKEN: ${{ secrets.SITE_ARCHIVE_TOKEN }}
        run: |
          set -u
          ECHECS=""
          FAIT=""
          note() { echo "$2" ; if [ "$1" = "ko" ]; then ECHECS="$ECHECS$2 | "; else FAIT="$FAIT$2 | "; fi; }

          git config --global user.name  "Archive Trader 360"
          git config --global user.email "clubtrader360@gmail.com"

          # ─── 1. LE BRIEF → DÉPÔT DU SITE ──────────────────────────────────────
          # Le site est un build Astro statique : le fichier doit être DANS son dépôt
          # au moment du build. On y écrit donc directement, plutôt que de déposer
          # sur une branche de données que le site irait chercher au build.
          #
          # ⚠️ Ce choix est celui du MODE DE PANNE. Un site qui récupère son contenu
          # par le réseau au moment du build produit, quand la récupération échoue,
          # un site VALIDE avec moins de briefs — et personne ne le remarque. Un
          # fichier commité, lui, est visible dans l'historique, relisible, et un
          # brief manquant se compte.
          # La cible — dépôt, branche, chemins — est lue dans outils/cible-archive.mjs,
          # LE MÊME fichier que celui qu'utilise le contrôleur de couverture. Deux
          # réponses différentes à « où va l'archive ? » produisent une panne verte :
          # on dépose là où rien ne rend, le contrôleur trouve le fichier, et la
          # notification annonce « à jour ». C'est arrivé, voir le commentaire de
          # cible-archive.mjs.
          CIBLE=$(node -e "
            import('./outils/cible-archive.mjs')
              .then(m => process.stdout.write([m.CIBLE.depot, m.CIBLE.branche, m.CIBLE.dossierBriefs, m.CIBLE.dossierRessources].join(' ')))
              .catch(e => { console.error(e.message); process.exit(1); })
          ")
          if [ -z "$CIBLE" ]; then
            echo "::error::Lecture de outils/cible-archive.mjs échouée. Rien n'est archivé."
            ECHECS="$ECHECS site: cible illisible | "
          fi
          set -- $CIBLE
          SITE_DEPOT="${1:-}"; SITE_BRANCHE="${2:-}"; SITE_BRIEFS="${3:-}"; SITE_RESS="${4:-}"

          if [ -z "${SITE_TOKEN:-}" ]; then
            echo "::error::SITE_ARCHIVE_TOKEN absent des secrets du dépôt. Le brief du $DATE_ISO n'est PAS archivé sur le site. Créer un jeton d'accès fin, portée « Contents: write » sur $SITE_DEPOT UNIQUEMENT, et l'enregistrer sous ce nom."
            ECHECS="$ECHECS site: jeton absent | "
          elif [ -n "$SITE_BRANCHE" ]; then
            rm -rf /tmp/site
            # ⚠️ `--branch` EXPLICITE. Sans lui, git clone la branche par DÉFAUT du
            # dépôt du site, qui n'est pas celle où vit la structure d'accueil de
            # l'archive. Le brief atterrissait sur `main`, où aucune page ne le rend.
            if git clone --depth=1 --quiet --branch "$SITE_BRANCHE" \
                 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_DEPOT}.git" /tmp/site; then

              # ⚠️ LES DÉPENDANCES, INSTALLÉES ICI ET NULLE PART AILLEURS.
              # `api/cron/daily-brief.js` importe `@supabase/supabase-js`, et sa chaîne
              # d'import traverse `sheets-client.js` qui tire `googleapis`. Or ce
              # workflow n'installait QUE la CLI Claude : au premier passage réel, le
              # 6 puis le 7 octobre, l'archivage du site a échoué sur
              # « Cannot find package '@supabase/supabase-js' ».
              #
              # ⚠️ POURQUOI AUCUNE RÉPÉTITION NE L'AVAIT VU : elles tournaient en
              # local, où `node_modules` existe. Le contrôle C de
              # verifier-archive-brief.mjs comparait fidèlement les deux chemins — et
              # les deux marchaient, chez moi. « Ça marche en local » n'est pas une
              # mesure de la CI.
              #
              # L'installation est DANS cette étape, et pas en étape séparée plus haut :
              # une étape autonome qui échoue ferait tomber le job AVANT l'envoi. Ici,
              # `continue-on-error` couvre tout, donc rien ne peut retenir le brief.
              if ! npm ci --no-audit --no-fund --silent 2>/tmp/npm.log; then
                echo "::warning::npm ci a échoué :"; tail -5 /tmp/npm.log
                note ko "site: dépendances non installées"
                cd "$GITHUB_WORKSPACE"
                RC=1
              else
                RC=0
              fi

              # ══ RECONSTRUIRE LE COURRIEL RÉELLEMENT ENVOYÉ ═══════════════════
              # ⚠️ /tmp/brief.html N'EST PAS LE COURRIEL. C'est le CORPS seul, extrait
              # de la sortie du modèle au `<div class="brief-marche">`. L'enveloppe —
              # fond crème, carte à 600 px, bandeau, pied — est posée bien plus tard,
              # par `wrapBriefHtml()` dans l'endpoint, au moment de l'envoi.
              #
              # Archiver /tmp/brief.html tel quel aurait produit un brief sans bandeau
              # ni carte : un artefact DIFFÉRENT de celui du rattrapage, alors que
              # toute la conception tient à ce que les deux chemins passent par la
              # même routine sur la même forme d'entrée. Le défaut ne se serait vu
              # qu'au premier envoi réel, sur la page publiée.
              #
              # On rejoue donc la chaîne de l'endpoint, avec SES fonctions et dans
              # SON ordre : stripLongDashes, puis stripAuditComment, puis
              # wrapBriefHtml. Pas de réimplémentation : une deuxième version du
              # gabarit finirait par diverger de celle qui part aux élèves.
              # `firstName: null` rend « Bonjour, » plutôt qu'un prénom ; la routine
              # d'archivage retire cette ligne dans les deux cas.
              if [ $RC -eq 0 ] && ! node -e "
                Promise.all([import('./api/cron/daily-brief.js'), import('node:fs')])
                  .then(([m, fs]) => {
                    let h = fs.readFileSync('/tmp/brief.html', 'utf8');
                    h = m.stripLongDashes(h).html;
                    h = m.stripAuditComment(h).html;
                    fs.writeFileSync('/tmp/courriel.html', m.wrapBriefHtml({
                      firstName: null,
                      dateLongFr: process.env.DATE_LONG_FR,
                      briefHtml: h,
                    }));
                  })
                  .catch((e) => { console.error(e.message); process.exit(1); });
              "; then
                note ko "site: reconstruction du courriel impossible"
                cd "$GITHUB_WORKSPACE"
                RC=1
              else
                RC=0
              fi

              # ⚠️ PAS DE `if node … | tee …; then`. Un `if` sur un pipeline teste le
              # code de sortie de la DERNIÈRE commande — `tee`, qui réussit toujours.
              # Le refus d'archivage serait passé pour une réussite. Ce piège a déjà
              # coûté un faux « ✅ envoyé » dans ce même workflow.
              if [ $RC -eq 0 ]; then
                node outils/archiver-brief.mjs /tmp/courriel.html "$DATE_ISO" "/tmp/site/$SITE_BRIEFS" \
                  > /tmp/archive.log 2>&1
                RC=$?
                cat /tmp/archive.log
              fi

              if [ $RC -eq 0 ]; then
                # Les fichiers du courriel — bandeau, logo, schéma de culture — sont
                # servis par le SITE et non par journaltrader360.fr, dont le sort
                # n'est pas tranché. La routine annonce ceux dont ce brief a besoin,
                # une ligne « RESSOURCE <chemin> » chacun : on ne redevine pas la
                # liste ici. Le bandeau est versionné (-v2, -v3…) et un grep écrit à
                # la main sur « culture/ » l'aurait manqué à chaque changement.
                MANQUE=0
                while IFS= read -r CHEMIN; do
                  [ -z "$CHEMIN" ] && continue
                  DEST="/tmp/site/$SITE_RESS/$CHEMIN"
                  [ -f "$DEST" ] && continue
                  mkdir -p "$(dirname "$DEST")"
                  # -L est indispensable : le domaine répond 308 sans lui, et curl
                  # écrirait quinze octets de redirection dans un fichier .png.
                  curl -sSL --max-time 30 -o "$DEST" "https://journaltrader360.fr/assets/$CHEMIN" || true
                  case "$(file -b --mime-type "$DEST" 2>/dev/null)" in
                    image/*) echo "   fichier du courriel récupéré : $CHEMIN" ;;
                    *) rm -f "$DEST"; MANQUE=$((MANQUE + 1))
                       echo "::warning::Fichier « $CHEMIN » non récupéré — l'archive du jour s'affichera sans lui." ;;
                  esac
                done < <(sed -n 's/^RESSOURCE //p' /tmp/archive.log)

                cd /tmp/site
                git add "$SITE_BRIEFS" "$SITE_RESS" 2>/dev/null || git add "$SITE_BRIEFS"
                if git diff --cached --quiet; then
                  note ok "site: déjà archivé"
                elif git commit -qm "archive : brief du $DATE_ISO" && git push -q origin "HEAD:$SITE_BRANCHE"; then
                  note ok "site: brief du $DATE_ISO publié sur $SITE_BRANCHE$([ "$MANQUE" -gt 0 ] && echo " ($MANQUE fichier(s) manquant(s))")"
                else
                  note ko "site: commit ou push refusé"
                fi
                cd "$GITHUB_WORKSPACE"
              else
                note ko "site: nettoyage refusé (voir ::error:: ci-dessus)"
              fi
            else
              note ko "site: clone de $SITE_BRANCHE impossible (branche absente, jeton expiré, ou portée insuffisante ?)"
            fi
          fi

          # ─── 2. LA NOTION DE CULTURE → BRANCHE donnees-culture ────────────────
          # Retour au dépôt courant, quoi qu'il se soit passé au-dessus. Le bloc
          # précédent fait un `cd /tmp/site`, et tous ses chemins de sortie repassent
          # bien ici — mais « tous les chemins repassent bien ici » est le genre
          # d'affirmation qu'un ajout futur rend fausse sans rien casser tout de suite.
          cd "$GITHUB_WORKSPACE"
          # Un fichier par NOTION, pas par date : c'est ce qui sert à écrire les
          # articles du site. L'archive des briefs, elle, est chronologique. Les deux
          # ne font donc pas double emploi.
          if node outils/archiver-culture.mjs /tmp/brief.html /tmp/culture "$DATE_ISO"; then
            if [ -z "$(ls -A /tmp/culture 2>/dev/null)" ]; then
              note ok "culture: aucune notion ce jour"
            else
              # Même motif que marche-cloture.yml, qui écrit sur `donnees-marche`
              # depuis des mois : c'est le seul écrivain de branche de données dont
              # on sache qu'il fonctionne en production.
              if git fetch origin donnees-culture --depth=1 2>/dev/null && git checkout -q donnees-culture; then :;
              else git checkout -q --orphan donnees-culture && git rm -rq --cached . 2>/dev/null || true; fi
              mkdir -p textes && cp /tmp/culture/*.md textes/ && git add textes
              if git diff --cached --quiet; then
                note ok "culture: texte identique, rien à écrire"
              elif git commit -qm "archive : notion du $DATE_ISO" && git push -q origin donnees-culture; then
                note ok "culture: $(ls /tmp/culture | tr '\n' ' ')archivée"
              else
                note ko "culture: commit ou push refusé"
              fi
            fi
          else
            note ko "culture: extraction refusée (voir ::error:: ci-dessus)"
          fi

          # ─── 3. VERDICT ───────────────────────────────────────────────────────
          # Écrit AVANT le exit : les sorties d'un step qui échoue restent lisibles
          # par les steps suivants, et c'est l'étape Discord qui en a besoin.
          {
            echo "fait=${FAIT:-rien}"
            echo "echecs=${ECHECS:-aucun}"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$ECHECS" ]; then
            echo "::error::Archivage incomplet : $ECHECS"
            exit 1
          fi
          echo "✅ Archivage complet : $FAIT"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CRON_WEBHOOK_URL }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          DATE_LONG_FR: ${{ steps.brief.outputs.date_long_fr }}
          MARCHE_ND: ${{ steps.brief.outputs.marche_nd }}
          MARCHE_MOTIFS: ${{ steps.brief.outputs.marche_motifs }}
          MARCHE_MANQUANTS: ${{ steps.brief.outputs.marche_manquants }}
          SENT: ${{ steps.post.outputs.sent }}
          FAILED: ${{ steps.post.outputs.failed }}
          DEST: ${{ steps.post.outputs.dest }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          ARCHIVE_FAIT: ${{ steps.archive.outputs.fait }}
          ARCHIVE_ECHECS: ${{ steps.archive.outputs.echecs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_CRON_WEBHOOK_URL absent — notif Discord ignorée."
            exit 0
          fi
          DATE_DISP="${DATE_LONG_FR:-$(TZ=Europe/Paris date +%Y-%m-%d)}"
          GOLD=13938487   # 0xd4af37
          RED=15680580    # 0xef4444
          FAILED_N=$(echo "${FAILED:-0}" | grep -oE '^[0-9]+$' || echo 0)
          # Les données de marché indisponibles remontent DANS LA NOTIFICATION, et
          # plus seulement dans un log. C'est le point 3 de la refonte : aujourd'hui,
          # un chiffre absent ou faux partait sans que personne ne le sache avant qu'un
          # élève le remarque. Un brief dont des valeurs manquent n'est pas un brief
          # « envoyé » sans plus de commentaire — il est envoyé AVEC des trous, et la
          # notification doit le dire en couleur.
          ND_N=$(echo "${MARCHE_ND:-0}" | grep -oE '^[0-9]+$' || echo 0)
          MANQ_N=$(echo "${MARCHE_MANQUANTS:-0}" | grep -oE '^[0-9]+$' || echo 0)
          ORANGE=16750848   # 0xff9900
          # ══ ÉTAT DE L'ARCHIVAGE ════════════════════════════════════════════
          # ⚠️ ON LIT `outcome`, PAS `conclusion`. L'étape d'archivage porte
          # `continue-on-error: true` pour ne jamais retenir un brief. GitHub met
          # alors `conclusion` à `success` quoi qu'il arrive, et ne laisse la vérité
          # que dans `outcome`. Une alerte branchée sur `conclusion` serait muette
          # POUR TOUJOURS, sans jamais rien casser : exactement le motif de panne qui
          # a laissé l'archivage de la culture inactif pendant cinq jours.
          #
          # Le cas « l'étape n'a pas tourné du tout » est traité à part. `outcome`
          # vaut alors la chaîne vide (step sauté) : ce n'est ni un succès ni un
          # échec, et le dire « ✅ » serait une affirmation fausse.
          case "${ARCHIVE_OUTCOME:-}" in
            success) ARCHIVE_TXT="✅ ${ARCHIVE_FAIT:-déposé}"; ARCHIVE_KO=0 ;;
            failure) ARCHIVE_TXT="❌ ${ARCHIVE_ECHECS:-échec}"; ARCHIVE_KO=1 ;;
            "")      ARCHIVE_TXT="⏭️ étape non exécutée (envoi non réussi) — rien n'est archivé"; ARCHIVE_KO=1 ;;
            *)       ARCHIVE_TXT="❓ état inattendu : $ARCHIVE_OUTCOME"; ARCHIVE_KO=1 ;;
          esac
          ARCHIVE_TXT=$(echo "$ARCHIVE_TXT" | sed 's/ | $//' | cut -c1-500)

          if [ "$POST_OUTCOME" = "success" ]; then
            if [ "$FAILED_N" -gt 0 ]; then COLOR=$RED
            elif [ "$ARCHIVE_KO" -eq 1 ]; then COLOR=$RED
            elif [ "$ND_N" -gt 0 ] || [ "$MANQ_N" -gt 0 ]; then COLOR=$ORANGE
            else COLOR=$GOLD; fi
            if [ "$ND_N" -gt 0 ]; then
              MARCHE_TXT="⚠️ $ND_N valeur(s) en n/d :"$'\n'"$(echo "$MARCHE_MOTIFS" | head -6)"
            else
              MARCHE_TXT="✅ toutes les valeurs collectées et validées"
            fi
            if [ "$MANQ_N" -gt 0 ]; then
              MARCHE_TXT="$MARCHE_TXT"$'\n'"❌ $MANQ_N chiffre(s) fourni(s) absents du brief — le modèle les a modifiés."
            fi
            TITRE="📊 Daily Brief envoyé"
            [ "$ND_N" -gt 0 ] || [ "$MANQ_N" -gt 0 ] && TITRE="📊 Daily Brief envoyé — données incomplètes"
            [ "$ARCHIVE_KO" -eq 1 ] && TITRE="📊 Daily Brief envoyé — ARCHIVAGE EN ÉCHEC"
            PAYLOAD=$(jq -n --argjson c "$COLOR" --arg date "$DATE_DISP" --arg titre "$TITRE" \
              --arg served "${SENT:-?} / ${DEST:-?}" --arg failed "${FAILED:-0}" --arg url "$RUN_URL" \
              --arg marche "$(echo "$MARCHE_TXT" | cut -c1-900)" \
              --arg archive "$ARCHIVE_TXT" \
              '{embeds:[{title:$titre,color:$c,fields:[
                {name:"Date",value:$date,inline:true},
                {name:"Élèves servis",value:$served,inline:true},
                {name:"Échecs",value:$failed,inline:true},
                {name:"Données de marché",value:$marche,inline:false},
                {name:"Archive",value:$archive,inline:false},
                {name:"Run",value:("[Voir le run](\($url))"),inline:false}
              ],timestamp:(now|todate)}]}')
          else
            PAYLOAD=$(jq -n --argjson c "$RED" --arg date "$DATE_DISP" --arg url "$RUN_URL" \
              '{embeds:[{title:"❌ ÉCHEC envoi daily-brief",color:$c,description:("Brief du \($date) — échec du pipeline.\n[Voir le run](\($url))"),timestamp:(now|todate)}]}')
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" \
            && echo "✅ Notif Discord envoyée" || echo "::warning::Échec de la notif Discord (non bloquant)."

      - name: Summary
        if: always()
        run: |
          echo "## Daily Brief Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger** : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date** : ${{ steps.brief.outputs.date_long_fr }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status** : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run** : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
