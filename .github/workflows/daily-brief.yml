name: Daily Brief Trader 360

on:
  schedule:
    # Cron 43 22 * * 0-4 :
    # - Été CEST (UTC+2) : 22h43 UTC = 00h43 Paris (nuit dim→jeu), arrivée typique 1h-2h, worst case 5h
    # - Hiver CET (UTC+1) : 22h43 UTC = 23h43 Paris (veille), arrivée typique 00h-1h, worst case 4h
    # → Aucun ajustement nécessaire au passage d'heure. Toujours avant 6h Paris.
    # Minute non-ronde (43) : évite la queue GitHub Actions des crons à minute ronde (lag jusqu'à 3-4h).
    - cron: '43 22 * * 0-4'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Raison du test manuel (log)'
        required: false
        default: 'Test manuel'
      only_user_id:
        description: 'UUID élève cible (test ciblé — vide = TOUS les éligibles)'
        required: false
        default: ''
      test_email:
        description: 'Email de test : envoi UNIQUEMENT à cette adresse (prioritaire sur only_user_id, zéro élève touché)'
        required: false
        default: ''

jobs:
  generate-and-send-brief:
    name: Génère le brief (Claude Code CLI) et l'envoie
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate brief HTML via Claude
        id: brief
        timeout-minutes: 25   # sous le job (30) → le step rate proprement avant la coupe brutale GH
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN manquant dans les Secrets GitHub (à générer via 'claude setup-token', lié à l'abo Claude Max)."
            exit 1
          fi

          DATE_ISO=$(TZ=Europe/Paris date +%Y-%m-%d)
          DATE_LONG_FR=$(TZ=Europe/Paris LC_TIME=fr_FR.UTF-8 date +"%A %-d %B %Y" 2>/dev/null || TZ=Europe/Paris date +"%A %-d %B %Y")
          DOW=$(TZ=Europe/Paris date +%u)   # 1=Lun … 7=Dim (rotation encart Ambassadeur)
          echo "📅 Brief du $DATE_LONG_FR ($DATE_ISO) · jour $DOW"

          # Contexte daté injecté en tête (évite que Claude devine la date).
          PROMPT="$(printf 'Date du jour (Europe/Paris) : %s (%s). Jour de semaine (1=Lun … 5=Ven) : %s.\n\n%s' \
            "$DATE_LONG_FR" "$DATE_ISO" "$DOW" "$(cat .github/workflows/prompts/daily-brief-system.md)")"

          echo "🤖 Claude Code CLI version : $(claude --version 2>&1 || echo 'inconnue')"
          echo "📝 Prompt système : $(wc -l < .github/workflows/prompts/daily-brief-system.md) lignes, $(wc -c < .github/workflows/prompts/daily-brief-system.md) octets"

          # Génération headless. --dangerously-skip-permissions : autorise WebSearch/WebFetch + Bash en CI.
          # On capture stdout (brief_raw.html) ET stderr (claude_err.log) séparément, sans exit immédiat,
          # pour TOUJOURS pouvoir afficher la vraie cause d'un échec (le 1er run a fail en silence).
          set +e
          echo "$PROMPT" | claude -p --output-format text --dangerously-skip-permissions \
            > /tmp/brief_raw.html 2>/tmp/claude_err.log
          EXIT_CODE=$?
          set -e

          # stderr affiché systématiquement (warnings utiles même en cas de succès).
          echo "---START STDERR---"
          cat /tmp/claude_err.log 2>/dev/null || true
          echo "---END STDERR---"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Claude CLI a échoué (exit code $EXIT_CODE)."
            echo "---START STDOUT (100 premières lignes) ---"
            head -100 /tmp/brief_raw.html 2>/dev/null || true
            echo "---END STDOUT---"
            echo "::error::Causes fréquentes : token invalide/incomplet · quota Claude Max épuisé (rate limit) · WebFetch/WebSearch refusés en CI · prompt trop long. Voir STDERR/STDOUT ci-dessus."
            exit 1
          fi

          # === VALIDATION STRICTE ANTI-MÉTA-COMMENTAIRE (bug prod P1) ===
          # 1. Extraction robuste : tout depuis <div class="brief-marche"> jusqu'à la FIN.
          #    Pardonne un préambule méta AVANT le vrai HTML (Claude a parfois bavardé) en le
          #    coupant. On va jusqu'à EOF (pas au 1er </div>) car le brief contient des <div>
          #    imbriqués (encarts) → s'arrêter au 1er </div> tronquait le brief.
          #    Si le marqueur est absent → /tmp/brief.html vide → échec (pas de mail cassé).
          sed -n '/<div class="brief-marche">/,$p' /tmp/brief_raw.html > /tmp/brief.html

          if [ ! -s /tmp/brief.html ]; then
            echo "::error::Bloc <div class=\"brief-marche\">…</div> introuvable dans la sortie Claude — méta-commentaire probable. Rien n'est envoyé."
            echo "---START STDOUT (100 lignes) ---"; head -100 /tmp/brief_raw.html 2>/dev/null || true; echo "---END STDOUT---"
            exit 1
          fi

          SIZE=$(wc -c < /tmp/brief.html)
          # 2a. Taille minimale plausible d'un vrai brief.
          if [ "$SIZE" -lt 3000 ]; then
            echo "::error::HTML extrait trop court ($SIZE octets < 3000) — probablement incomplet ou méta. Rien n'est envoyé."
            echo "---START HTML---"; cat /tmp/brief.html; echo "---END HTML---"
            exit 1
          fi
          # 2b. Double-check du marqueur (l'extraction le garantit, ceinture + bretelles).
          if ! grep -q 'brief-marche' /tmp/brief.html; then
            echo "::error::Marqueur 'brief-marche' absent après extraction. Rien n'est envoyé."; exit 1
          fi
          # 2c. Ne doit pas COMMENCER par du texte méta (1re ligne non vide, casse ignorée).
          FIRST=$(grep -m1 -v '^[[:space:]]*$' /tmp/brief.html || true)
          if echo "$FIRST" | grep -qiE '^[[:space:]]*(le brief|voici|j.ai|points cl|sauvegard|le fichier)'; then
            echo "::error::Le HTML commence par un méta-commentaire : $FIRST — Rien n'est envoyé."; exit 1
          fi
          # 2d. Doit commencer par une balise HTML valide.
          if ! echo "$FIRST" | grep -qiE '^[[:space:]]*<(!doctype|html|div|article|section)'; then
            echo "::error::Le HTML ne commence pas par une balise valide (<!DOCTYPE/<html/<div/<article/<section) : $FIRST — Rien n'est envoyé."; exit 1
          fi

          echo "✅ HTML validé ($SIZE octets)"
          echo "date_iso=$DATE_ISO" >> "$GITHUB_OUTPUT"
          echo "date_long_fr=$DATE_LONG_FR" >> "$GITHUB_OUTPUT"

      - name: POST to daily-brief endpoint
        id: post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY_USER_ID: ${{ github.event.inputs.only_user_id }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          REASON: ${{ github.event.inputs.reason || 'cron auto' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant côté GitHub."
            exit 1
          fi
          DATE_ISO="${{ steps.brief.outputs.date_iso }}"
          DATE_LONG_FR="${{ steps.brief.outputs.date_long_fr }}"

          # Validation UUID si only_user_id fourni (anti-injection).
          if [ -n "$ONLY_USER_ID" ] && ! echo "$ONLY_USER_ID" | grep -qiE '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'; then
            echo "::error::only_user_id invalide (UUID attendu) : '$ONLY_USER_ID'"
            exit 1
          fi

          # Construction du body JSON (jq gère l'échappement du HTML).
          if [ -n "$TEST_EMAIL" ]; then
            echo "🧪 Test email ciblé : $TEST_EMAIL (aucun élève réel touché)"
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --arg dl "$DATE_LONG_FR" --rawfile bh /tmp/brief.html --arg te "$TEST_EMAIL" \
              '{date:$date, date_long_fr:$dl, brief_html:$bh, test_emails:[$te]}')
          elif [ -n "$ONLY_USER_ID" ]; then
            echo "🎯 Test ciblé élève : $ONLY_USER_ID"
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --arg dl "$DATE_LONG_FR" --rawfile bh /tmp/brief.html --arg uid "$ONLY_USER_ID" \
              '{date:$date, date_long_fr:$dl, brief_html:$bh, only_user_id:$uid}')
          else
            echo "🚀 Envoi à TOUS les éligibles (raison: $REASON)"
            PAYLOAD=$(jq -n --arg date "$DATE_ISO" --arg dl "$DATE_LONG_FR" --rawfile bh /tmp/brief.html \
              '{date:$date, date_long_fr:$dl, brief_html:$bh}')
          fi

          response=$(curl -sSL -w "\n---HTTP_STATUS:%{http_code}---" -X POST \
            "https://www.journaltrader360.fr/api/cron/daily-brief" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 180 \
            --retry 2 --retry-delay 10)

          body=$(echo "$response" | sed -e 's/---HTTP_STATUS:.*//')
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          echo "HTTP Status: $status"
          echo "Response body:"; echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Endpoint daily-brief a répondu $status (attendu 200). Body ci-dessus."
            exit 1
          fi

          sent=$(echo "$body" | grep -oE '"sent":[0-9]+' | head -1 | cut -d: -f2 || echo "?")
          failed=$(echo "$body" | grep -oE '"failed":[0-9]+' | head -1 | cut -d: -f2 || echo "?")
          dest=$(echo "$body" | grep -oE '"destinataires":[0-9]+' | head -1 | cut -d: -f2 || echo "?")
          echo "✅ $sent envoyé(s) · $failed échec(s) · $dest destinataire(s)"
          if [ "${failed:-0}" != "0" ] && [ -n "${failed}" ]; then
            echo "::warning::$failed mail(s) ont échoué côté Resend. Voir le JSON ci-dessus."
          fi
          # Expose les compteurs au step de notif Discord.
          { echo "sent=${sent:-0}"; echo "failed=${failed:-0}"; echo "dest=${dest:-0}"; } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CRON_WEBHOOK_URL }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          DATE_LONG_FR: ${{ steps.brief.outputs.date_long_fr }}
          SENT: ${{ steps.post.outputs.sent }}
          FAILED: ${{ steps.post.outputs.failed }}
          DEST: ${{ steps.post.outputs.dest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_CRON_WEBHOOK_URL absent — notif Discord ignorée."
            exit 0
          fi
          DATE_DISP="${DATE_LONG_FR:-$(TZ=Europe/Paris date +%Y-%m-%d)}"
          GOLD=13938487   # 0xd4af37
          RED=15680580    # 0xef4444
          FAILED_N=$(echo "${FAILED:-0}" | grep -oE '^[0-9]+$' || echo 0)
          if [ "$POST_OUTCOME" = "success" ]; then
            if [ "$FAILED_N" -gt 0 ]; then COLOR=$RED; else COLOR=$GOLD; fi
            PAYLOAD=$(jq -n --argjson c "$COLOR" --arg date "$DATE_DISP" \
              --arg served "${SENT:-?} / ${DEST:-?}" --arg failed "${FAILED:-0}" --arg url "$RUN_URL" \
              '{embeds:[{title:"📊 Daily Brief envoyé",color:$c,fields:[
                {name:"Date",value:$date,inline:true},
                {name:"Élèves servis",value:$served,inline:true},
                {name:"Échecs",value:$failed,inline:true},
                {name:"Run",value:("[Voir le run](\($url))"),inline:false}
              ],timestamp:(now|todate)}]}')
          else
            PAYLOAD=$(jq -n --argjson c "$RED" --arg date "$DATE_DISP" --arg url "$RUN_URL" \
              '{embeds:[{title:"❌ ÉCHEC envoi daily-brief",color:$c,description:("Brief du \($date) — échec du pipeline.\n[Voir le run](\($url))"),timestamp:(now|todate)}]}')
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" \
            && echo "✅ Notif Discord envoyée" || echo "::warning::Échec de la notif Discord (non bloquant)."

      - name: Summary
        if: always()
        run: |
          echo "## Daily Brief Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger** : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date** : ${{ steps.brief.outputs.date_long_fr }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status** : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run** : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
