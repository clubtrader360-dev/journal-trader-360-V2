name: Vérification de l'archive

# ══════════════════════════════════════════════════════════════════════════════
# UN BRIEF EST-IL PARTI SANS REJOINDRE L'ARCHIVE ?
#
# ── POURQUOI UN WORKFLOW SÉPARÉ ───────────────────────────────────────────────
# L'étape d'archivage de `daily-brief.yml` signale déjà ses propres échecs dans la
# notification Discord du run. Cela couvre UN cas : le dispositif a tourné, il a
# raté.
#
# ⚠️ Cela ne couvre pas le cas qui s'est réellement produit. La PR #106 ajoutait
# l'archivage de la notion de culture. Elle est restée ouverte. Le workflow exécuté
# chaque nuit ne portait donc AUCUNE étape d'archivage : rien n'a échoué, rien n'a
# alerté, et quatre notions publiées entre le 23 et le 28 septembre ont disparu
# avec l'expiration de leurs artefacts. Le LISEZ-MOI de `donnees-culture`
# affirmait pendant ce temps que la branche « se remplit automatiquement ».
#
# Un dispositif qui n'a JAMAIS rien produit ne peut pas se signaler lui-même : du
# code absent ne lève pas d'erreur, et une notification qu'on n'a pas écrite ne
# s'envoie pas. Il faut un observateur EXTÉRIEUR, qui ne demande rien au dispositif
# et part d'un fait indépendant : des briefs sont partis à ces dates-là.
#
# ── DÉLAI DE DÉTECTION ────────────────────────────────────────────────────────
# Le brief part entre 23h43 et 1h du matin. Ce contrôle passe à 7h05 UTC, soit
# 9h05 Paris en été et 8h05 en hiver. Un brief envoyé cette nuit et non archivé est
# donc signalé LE MATIN MÊME, en moins de neuf heures. La notification du run, elle,
# signale en quelques minutes le cas « l'étape a tourné et raté ».
#
# ── ET SI CE CONTRÔLE-LÀ S'ARRÊTE ? ───────────────────────────────────────────
# Un chien de garde muet ne vaut rien, et GitHub désactive les workflows planifiés
# après soixante jours sans activité dans le dépôt. D'où la BATTUE HEBDOMADAIRE :
# le lundi, le contrôle poste son résultat même quand tout va bien. Une semaine
# sans message du lundi veut dire que le contrôle lui-même ne tourne plus.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Bien après le brief (23h43-1h) et bien avant la fin de matinée. Minute non
    # ronde pour éviter la file d'attente des crons à l'heure pile.
    - cron: '5 7 * * *'
  workflow_dispatch:

permissions:
  actions: read      # lire la liste et le contenu des artefacts de brief
  contents: read     # lire la branche donnees-culture

jobs:
  couverture:
    name: Chaque brief parti est-il archivé ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Le jeton du site est-il en bonne santé ?
        id: jeton
        # ══ POURQUOI CE CONTRÔLE EST ICI ══════════════════════════════════════
        # Le jeton d'accès au dépôt du site est le point de défaillance le plus
        # probable de tout le dispositif : il expire, il peut être révoqué, et sa
        # portée peut avoir été mal choisie à la création. Quand il tombe, le clone
        # échoue, l'archivage s'arrête — proprement, en `continue-on-error`, donc
        # sans rien casser. C'est exactement la panne que ce workflow existe pour
        # voir, et l'expiration est la seule dont on connaisse la date À L'AVANCE.
        #
        # ⚠️ ON LIT LE CODE DE RÉPONSE, PAS SEULEMENT L'EN-TÊTE D'ÉCHÉANCE.
        # La première version se contentait de chercher `github-authentication-token-
        # expiration` dans les en-têtes. Elle a conclu « échéance non communiquée »
        # sur un jeton qui, en réalité, n'avait pas accès au dépôt : un jeton rejeté
        # ne renvoie pas cet en-tête non plus. Même silence, deux causes opposées —
        # l'une bénigne, l'autre bloquante. Une sonde qui ne les distingue pas dit
        # quelque chose de rassurant dans les deux cas.
        #
        # ⛔ LE JETON N'EST JAMAIS AFFICHÉ. Seuls le code HTTP, le compte porteur et
        # l'en-tête d'échéance le sont. GitHub masque de toute façon les secrets dans
        # les journaux, mais on ne s'appuie pas là-dessus : on n'imprime que ce qu'on
        # veut lire.
        if: always()
        env:
          SITE_ARCHIVE_TOKEN: ${{ secrets.SITE_ARCHIVE_TOKEN }}
        run: |
          if [ -z "${SITE_ARCHIVE_TOKEN:-}" ]; then
            echo "::error::SITE_ARCHIVE_TOKEN absent des secrets."
            echo "expire=absent" >> "$GITHUB_OUTPUT"; exit 1
          fi
          CIBLE=$(node -e "import('./outils/cible-archive.mjs').then(m=>process.stdout.write(m.CIBLE.depot))")
          APPEL() { curl -sS -o /tmp/corps -D /tmp/entetes -w '%{http_code}' \
                      -H "authorization: Bearer $SITE_ARCHIVE_TOKEN" \
                      -H "accept: application/vnd.github+json" "$1"; }

          CODE_RACINE=$(APPEL "https://api.github.com/")
          # ⚠️ Le repli est SORTI du pipeline : `a | b | c || defaut` ne teste que le
          # code de sortie de `c`, qui réussit sur une entrée vide.
          EXP=$(tr -d '\r' < /tmp/entetes | sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration: *//p' | head -1)

          # Les portées, quand il s'agit d'un jeton CLASSIQUE : l'en-tête les liste.
          # Un jeton fin ne rend pas cet en-tête. C'est donc aussi la façon de savoir
          # LEQUEL des deux on a sous la main, information décisive pour corriger.
          PORTEES=$(tr -d '\r' < /tmp/entetes | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p' | head -1)

          CODE_USER=$(APPEL "https://api.github.com/user")
          PORTEUR=$(sed -n 's/.*"login" *: *"\([^"]*\)".*/\1/p' /tmp/corps | head -1)

          CODE_DEPOT=$(APPEL "https://api.github.com/repos/$CIBLE")

          echo "Santé du jeton du site :"
          echo "   GET /                → HTTP $CODE_RACINE"
          echo "   GET /user            → HTTP $CODE_USER  ${PORTEUR:+(porteur : $PORTEUR)}"
          echo "   GET /repos/$CIBLE → HTTP $CODE_DEPOT"
          echo "   échéance             → ${EXP:-non communiquée}"
          if [ -n "$PORTEES" ]; then
            echo "   nature               → jeton CLASSIQUE, portées : $PORTEES"
          else
            echo "   nature               → jeton FIN (aucune portée OAuth annoncée)"
          fi
          echo "expire=${EXP:-non communiquée}" >> "$GITHUB_OUTPUT"

          if [ "$CODE_RACINE" != "200" ]; then
            echo "::error::Le jeton est REJETÉ par l'API (HTTP $CODE_RACINE sur /). Révoqué, expiré, ou mal copié."
            exit 1
          fi
          if [ "$CODE_DEPOT" != "200" ]; then
            if [ -n "$PORTEES" ]; then
              echo "::error::Le jeton ne voit PAS $CIBLE (HTTP $CODE_DEPOT). C'est un jeton CLASSIQUE, portées « $PORTEES » : pour un dépôt privé il lui faut la portée « repo ». L'archivage échouera à chaque brief."
            else
              echo "::error::Le jeton ne voit PAS $CIBLE (HTTP $CODE_DEPOT). C'est un jeton FIN : le dépôt n'est pas dans la liste des dépôts qu'il couvre. GitHub rend 404 plutôt que 403 pour ne pas révéler l'existence d'un dépôt. L'archivage échouera à chaque brief."
            fi
            exit 1
          fi

          if [ -n "$EXP" ]; then
            FIN=$(date -u -d "$EXP" +%s 2>/dev/null || echo "")
            if [ -n "$FIN" ]; then
              JOURS=$(( (FIN - $(date -u +%s)) / 86400 ))
              echo "jours=$JOURS" >> "$GITHUB_OUTPUT"
              echo "   soit $JOURS jour(s)"
              if [ "$JOURS" -lt 0 ]; then
                echo "::error::Le jeton du site a EXPIRÉ."; exit 1
              elif [ "$JOURS" -lt 21 ]; then
                echo "::warning::Le jeton du site expire dans $JOURS jour(s) — à renouveler avant l'échéance."
              fi
            fi
          else
            echo "::warning::Le jeton ne communique pas d'échéance (jeton sans expiration, ou classique). Il fonctionne, mais sa fin de vie ne pourra pas être annoncée."
          fi

      - name: Comparer les briefs partis et l'archive
        id: verif
        # ⛔ PAS de `continue-on-error` ici, et c'est volontairement l'inverse de
        # l'étape d'archivage. Là-bas, un échec ne doit pas retenir le brief. Ici,
        # l'échec EST le produit : il doit se voir dans l'historique des runs, en
        # rouge, même si la notification Discord venait à ne pas partir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_ARCHIVE_TOKEN: ${{ secrets.SITE_ARCHIVE_TOKEN }}
        run: |
          if [ -z "${SITE_ARCHIVE_TOKEN:-}" ]; then
            echo "::error::SITE_ARCHIVE_TOKEN absent : impossible de lire l'archive du site. Le contrôle ne peut pas conclure, et une absence de conclusion n'est PAS un feu vert."
            exit 1
          fi
          node outils/verifier-couverture-archive.mjs

      - name: Alerter Discord
        # `always()` : c'est justement quand l'étape précédente a échoué qu'il faut
        # parler. Et le lundi, on parle aussi quand tout va bien — voir la battue
        # hebdomadaire en tête de fichier.
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CRON_WEBHOOK_URL }}
          VERIF_OUTCOME: ${{ steps.verif.outcome }}
          JETON_EXPIRE: ${{ steps.jeton.outputs.expire }}
          JETON_JOURS: ${{ steps.jeton.outputs.jours }}
          ANOMALIES: ${{ steps.verif.outputs.anomalies }}
          RESUME: ${{ steps.verif.outputs.resume }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_CRON_WEBHOOK_URL absent — alerte non envoyée."
            exit 0
          fi
          JOUR=$(date -u +%u)   # 1 = lundi
          ROUGE=15680580; VERT=3066993; ORANGE=16750848

          if [ "$VERIF_OUTCOME" != "success" ] && [ -z "${ANOMALIES:-}" ]; then
            # Le script n'a pas pu conclure (jeton manquant, API indisponible…).
            # ⚠️ Ce n'est ni un succès ni une anomalie d'archivage, et l'annoncer
            # en vert serait affirmer quelque chose qu'on ne sait pas.
            TITRE="❓ Vérification de l'archive impossible"
            COULEUR=$ORANGE
            TEXTE="Le contrôle n'a pas pu s'exécuter jusqu'au bout. Tant qu'il ne conclut pas, on ne sait PAS si les briefs sont archivés."
          elif [ "${ANOMALIES:-0}" -gt 0 ] 2>/dev/null; then
            TITRE="🚨 Des briefs sont partis sans rejoindre l'archive"
            COULEUR=$ROUGE
            TEXTE="$RESUME"
          elif [ "$JOUR" = "1" ]; then
            TITRE="✅ Archive des briefs à jour"
            COULEUR=$VERT
            TEXTE="$RESUME"$'\n\n'"Jeton du site : expire le ${JETON_EXPIRE:-?}${JETON_JOURS:+ (dans $JETON_JOURS j)}."$'\n\n'"_Message du lundi. S'il manque une semaine, c'est le contrôle lui-même qui ne tourne plus._"
          else
            echo "Rien à signaler et nous ne sommes pas lundi : aucune notification."
            exit 0
          fi

          PAYLOAD=$(jq -n --arg t "$TITRE" --argjson c "$COULEUR" --arg url "$RUN_URL" \
            --arg d "$(printf '%s' "$TEXTE" | cut -c1-3500)" \
            '{embeds:[{title:$t,color:$c,description:($d+"\n\n[Voir le run](\($url))"),timestamp:(now|todate)}]}')
          curl -sS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD" \
            && echo "Alerte envoyée." || echo "::warning::Échec de l'envoi Discord."
