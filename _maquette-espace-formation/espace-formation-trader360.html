<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Espace Formation Trader 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout : barre fixe + tableau de bord (progression, niveau, série) puis grille des 10 modules ; vue module = liste des chapitres + lecteur. Charte trader360.fr, noir profond et or. */
:root{
  --bg:#050506; --surface:#111318; --surface-2:#161a20; --surface-3:#1b2028;
  --ink:#f7f6f3; --ink-soft:#a6a6a1; --ink-mute:#7e7e77;
  --gold:#e8b84b; --gold-2:#f3d585; --gold-deep:#b98a2e;
  --gold-glow:rgba(232,184,75,.5); --gold-wash:rgba(232,184,75,.08); --gold-line:rgba(232,184,75,.35);
  --line:#1e2128; --line-soft:#15171c;
  --ok:#10b981; --ok-glow:#34d399; --ok-wash:rgba(16,185,129,.12);
  --on-gold:#120e07;
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  --r-card:18px; --r-pill:40px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 50% -120px,rgba(232,184,75,.10),transparent 70%)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gold-text{background:linear-gradient(180deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,5,6,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo svg{width:30px;height:30px}
.logo b{font-weight:600;letter-spacing:.18em;font-size:14px}
.logo .sep{width:1px;height:22px;background:var(--gold)}
.nav{display:flex;gap:22px;margin-left:8px}
.nav button{background:none;border:0;padding:6px 0;color:var(--ink-soft);font-size:15px}
.nav button[aria-current="true"]{color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.xp-chip{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border:1px solid var(--line);border-radius:var(--r-pill);background:rgba(255,255,255,.03);font-size:13px}
.xp-chip .lvl{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--on-gold);font-weight:700;border-radius:var(--r-pill);padding:4px 12px;box-shadow:0 8px 30px -8px var(--gold-glow)}

main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 80px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:var(--r-pill);padding:13px 24px;font-weight:600;font-size:15px;border:1px solid transparent;text-decoration:none;transition:transform .15s ease,box-shadow .2s ease}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--on-gold);box-shadow:0 8px 30px -8px var(--gold-glow)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 12px 36px -8px var(--gold-glow)}
.btn-ghost{background:rgba(255,255,255,.03);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}

/* Hero dashboard */
.hero{padding:56px 0 36px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,76px);font-weight:800;letter-spacing:-.03em;line-height:.98;margin:14px 0 18px;text-wrap:balance}
.hero p.lead{color:var(--ink-soft);font-size:18px;max-width:52ch;margin:0 0 28px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px}
.resume-meta{margin-top:14px;font-size:14px;color:var(--ink-mute)}
.resume-meta b{color:var(--ink-soft);font-weight:500}

.dash{background:rgba(17,19,24,.8);border:1px solid var(--line);border-radius:var(--r-card);padding:26px;display:grid;gap:22px}
.ring-row{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val strong{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .val span{display:block;font-size:11px;color:var(--ink-mute);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.ring-side{display:grid;gap:6px;min-width:0}
.ring-side .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ring-side .small{font-size:14px;color:var(--ink-soft)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}
.stat .v{font-family:var(--f-mono);font-size:20px;font-weight:700;margin-top:2px}
.lvl-bar .head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft);margin-bottom:8px;gap:10px}
.lvl-bar .head b{color:var(--ink);font-weight:600}

/* progress bar */
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-2));box-shadow:0 0 14px var(--gold-glow);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.done i{background:linear-gradient(90deg,#0c8f65,var(--ok),var(--ok-glow));box-shadow:0 0 14px rgba(16,185,129,.45)}
.bar.thin{height:5px}

/* Ladder (the 7 steps) */
.ladder{display:flex;gap:6px}
.ladder span{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.ladder span.on{background:var(--gold)}
.ladder-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-mute);margin-top:6px}

/* Week streak */
.weeks{display:flex;gap:6px;align-items:flex-end}
.weeks div{flex:1;display:grid;gap:5px;justify-items:center}
.weeks i{width:100%;height:26px;border-radius:7px;background:var(--surface-3);border:1px solid var(--line-soft)}
.weeks i.on{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:transparent;box-shadow:0 6px 16px -8px var(--gold-glow)}
.weeks i.now{border-color:var(--gold-line)}
.weeks small{font-size:10px;color:var(--ink-mute);font-family:var(--f-mono)}

/* Section headers */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:44px 0 22px}
.sec-head h2{font-size:clamp(30px,4.2vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:10px 0 0;text-wrap:balance}
.sec-head p{color:var(--ink-soft);margin:0;max-width:44ch;font-size:15px}

/* Module grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mod{position:relative;text-align:left;background:rgba(17,19,24,.8);border:1px solid var(--line);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:12px;min-height:236px;transition:border-color .2s,transform .2s,background .2s}
.mod:hover:not(.locked){border-color:var(--gold-line);transform:translateY(-2px);background:rgba(22,26,32,.9)}
.mod .num{font-family:var(--f-mono);font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.mod h3{font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:0;text-wrap:balance}
.mod p{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.5}
.mod .foot{margin-top:auto;display:grid;gap:10px}
.mod .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-mute);gap:8px}
.mod.locked{cursor:not-allowed}
.mod.locked > *:not(.pill){opacity:.5}
.mod.current{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-wash),0 20px 60px -30px var(--gold-glow)}
.pill{position:absolute;top:18px;right:18px;font-size:11px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--line);color:var(--ink-soft);background:var(--surface-2);display:inline-flex;align-items:center;gap:6px}
.pill.go{color:var(--gold);border-color:var(--gold-line);background:var(--gold-wash)}
.pill.ok{color:var(--ok-glow);border-color:rgba(16,185,129,.35);background:var(--ok-wash)}
.pill svg{width:12px;height:12px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:rgba(17,19,24,.8);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 14px;display:grid;justify-items:center;text-align:center;gap:10px}
.badge .medal{width:64px;height:64px}
.badge strong{font-size:14px;font-weight:700;line-height:1.25}
.badge span{font-size:12px;color:var(--ink-mute);line-height:1.4}
.badge.off .medal{filter:grayscale(1) brightness(.45)}
.badge.off strong{color:var(--ink-soft)}

/* Notes overview */
.notes-wrap{display:grid;gap:22px}
.notes-mod h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.notes-mod h3 span{color:var(--ink-mute);letter-spacing:0;text-transform:none;font-weight:500;font-size:13px}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.note-card{text-align:left;background:rgba(17,19,24,.8);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;display:grid;gap:8px;transition:border-color .2s}
.note-card:hover{border-color:var(--gold-line)}
.note-card .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-mute)}
.note-card .h b{color:var(--ink);font-weight:600;font-size:14.5px}
.note-card .h em{font-style:normal;color:var(--gold);white-space:nowrap}
.note-card p{margin:0;font-size:14.5px;color:var(--ink-soft);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.notes-empty{border:1px dashed var(--line);border-radius:var(--r-card);padding:28px;text-align:center;color:var(--ink-soft)}
.notes-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notes-tools input{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink);padding:10px 16px;font:inherit;font-size:14px;min-width:0;width:260px;max-width:100%}
.notes-tools input:focus{outline:none;border-color:var(--gold-line)}

/* Module view */
.crumbs{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-mute);padding:28px 0 0;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--ink-soft)}
.crumbs button:hover{color:var(--ink)}
.mhead{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:18px 0 26px;border-bottom:1px solid var(--line)}
.mhead h1{font-size:clamp(32px,5vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:12px 0 12px;text-wrap:balance}
.mhead p{margin:0;color:var(--ink-soft);max-width:60ch}
.mhead .mprog{min-width:220px;display:grid;gap:8px}
.mhead .mprog .head{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft)}
.mview{display:grid;grid-template-columns:340px 1fr;gap:24px;padding-top:26px;align-items:start}
.chap-list{background:rgba(17,19,24,.8);border:1px solid var(--line);border-radius:var(--r-card);padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 110px);overflow:auto}
.chap-group{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding:14px 12px 6px;font-weight:700}
.chap{width:100%;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px}
.chap:hover{background:var(--surface-2)}
.chap[aria-current="true"]{background:var(--surface-2);border-color:var(--gold-line)}
.chap .dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ink-mute)}
.chap[aria-current="true"] .dot{border-color:var(--gold);color:var(--gold)}
.chap.done .dot{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.chap.done .dot svg{width:14px;height:14px}
.chap .t{font-size:14.5px;font-weight:500;line-height:1.3}
.chap .s{font-size:12px;color:var(--ink-mute)}

.player{display:grid;gap:18px;min-width:0}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);
  background:
   linear-gradient(180deg,rgba(5,5,6,.2),rgba(5,5,6,.85)),
   repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,255,255,.025) 59px 60px),
   repeating-linear-gradient(0deg,transparent 0 59px,rgba(255,255,255,.025) 59px 60px),
   radial-gradient(600px 300px at 70% 30%,rgba(232,184,75,.12),transparent 70%),
   var(--surface)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%}
.screen .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.play{width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,var(--gold-2),var(--gold));display:grid;place-items:center;box-shadow:0 10px 40px -8px var(--gold-glow);margin:0 auto 14px}
.play svg{width:28px;height:28px;margin-left:4px}
.screen .over small{display:block;color:var(--ink-soft);font-size:13px}
.screen .tag{position:absolute;left:16px;bottom:14px;font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);background:rgba(5,5,6,.7);border:1px solid var(--line);padding:4px 10px;border-radius:var(--r-pill)}
.lesson-head{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}
.lesson-head h2{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.025em;margin:6px 0 0;line-height:1.1}
.lesson-actions{display:flex;gap:10px;flex-wrap:wrap}
.card{background:rgba(17,19,24,.8);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.card h4{margin:0 0 10px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes textarea{width:100%;min-height:120px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:14px;font:inherit;font-size:15px;line-height:1.5}
.notes textarea:focus{outline:none;border-color:var(--gold-line)}
.notes .saved{font-size:12px;color:var(--ink-mute);margin-top:6px;min-height:18px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Certificate */
.cert{border:1px solid var(--gold-line);border-radius:var(--r-card);padding:34px 28px;text-align:center;background:radial-gradient(500px 220px at 50% 0,rgba(232,184,75,.14),transparent 70%),var(--surface)}
.cert h3{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:-.03em;margin:10px 0 6px}
.cert p{color:var(--ink-soft);margin:0 auto;max-width:48ch}

/* Toast + modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--surface-2);border:1px solid var(--gold-line);border-radius:var(--r-pill);padding:10px 18px 10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 20px 50px -20px #000;transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .xp{font-family:var(--f-mono);font-weight:700;color:var(--on-gold);background:linear-gradient(180deg,var(--gold-2),var(--gold));border-radius:var(--r-pill);padding:2px 10px;font-size:13px}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(5,5,6,.8);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--gold-line);border-radius:22px;padding:34px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 30px 80px -20px var(--gold-glow)}
.modal .medal{width:96px;height:96px;margin:0 auto 10px}
.modal h3{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0 8px;line-height:1.05}
.modal p{color:var(--ink-soft);margin:0 0 22px}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

footer{border-top:1px solid var(--line);margin-top:60px;padding:26px 0 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-mute)}
footer button{background:none;border:0;padding:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font-size:13px}
footer .acts{display:flex;gap:18px;flex-wrap:wrap}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:36px}
  .mview{grid-template-columns:1fr}
  .chap-list{position:static;max-height:none}
  .mhead{grid-template-columns:1fr}
  .nav{display:none}
}
@media (max-width:520px){
  .xp-chip .xpt{display:none}
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .stat{padding:10px}
  .stat .v{font-size:17px}
  .ring{width:110px;height:110px}
  .ring .val strong{font-size:28px}
  .dash{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#accueil" aria-label="Trader 360, accueil de l'espace formation">
      <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d585"/><stop offset="1" stop-color="#b98a2e"/></linearGradient></defs><path d="M20 2.5 35.2 11.25v17.5L20 37.5 4.8 28.75v-17.5Z" fill="none" stroke="url(#lg)" stroke-width="2.2"/><path d="M12.5 14h15M20 14v15" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="sep"></span><b>TRADER<span class="gold-text">360</span></b>
    </a>
    <nav class="nav" aria-label="Sections">
      <button data-go="accueil" aria-current="true">Mon parcours</button>
      <button data-go="modules">Les modules</button>
      <button data-go="notes">Mes notes</button>
      <button data-go="badges">Mes badges</button>
    </nav>
    <div class="top-right">
      <div class="xp-chip" title="Expérience accumulée"><span class="xpt mono" id="chipXp">0 XP</span><span class="lvl" id="chipLvl">Découvrir</span></div>
    </div>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ============ Données du parcours ============ */
/* Nombre de chapitres calé sur les dossiers Vimeo « Formation » (MODULE 1 → 9, 7BIS). Titres génériques à renommer. */
const MODULES=[
 {n:1,t:"Se préparer mentalement et comprendre les bases",d:"Les objectifs, la discipline, la routine. Ce qui se met en place avant les graphiques.",groups:[{c:7}]},
 {n:2,t:"Comprendre le trading",d:"Ce qu'on échange, comment se lit un graphique, ce qui fait bouger un prix.",groups:[{c:10}]},

 {name:"Découvrir",xp:0},{name:"Psychologie",xp:800},{name:"Méthode",xp:2000},{name:"Outils",xp:3500},
 {name:"Discipline",xp:5000},{name:"Financé",xp:6500},{name:"Durer",xp:8200}

function blank(){return {done:{},notes:{},last:null,modsDone:{}}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.done)return Object.assign(blank(),r)}catch(e){}return blank()}

/* ============ Calculs ============ */
const modDone=m=>m.chapters.filter(c=>S.done[c.id]).length;
const modPct=m=>Math.round(modDone(m)/m.chapters.length*100);
const isComplete=m=>modDone(m)===m.chapters.length;
const certUnlocked=()=>MODULES.filter(m=>!m.cert).every(isComplete);
function totalXp(){
  let x=Object.keys(S.done).length*XP_CHAP;
  MODULES.forEach(m=>{if(isComplete(m))x+=m.cert?XP_CERT:XP_MOD});
  return x;
}
function levelOf(x){let i=0;LEVELS.forEach((l,k)=>{if(x>=l.xp)i=k});return i}
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+"-"+Math.ceil(((d-y)/864e5+1)/7)}
function weekKeys(n){const out=[];const d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i*7);out.push(isoWeek(x))}return out}
function activeWeeks(){const s=new Set();Object.values(S.done).forEach(ts=>s.add(isoWeek(new Date(ts))));return s}
function streak(){
  const act=activeWeeks();const keys=weekKeys(52).reverse();let n=0;
  for(let i=0;i<keys.length;i++){ if(act.has(keys[i]))n++; else if(i===0) continue; else break; }
  return n;
}
function nextUp(){
  if(S.last){const [mi,ci]=S.last;const m=MODULES[mi];if(m&&!(m.cert&&!certUnlocked())){const c=m.chapters[ci];if(c&&!S.done[c.id])return [mi,ci]}}
  for(let mi=0;mi<MODULES.length;mi++){const m=MODULES[mi];if(m.cert&&!certUnlocked())continue;const ci=m.chapters.findIndex(c=>!S.done[c.id]);if(ci>-1)return [mi,ci]}
  return null;
}

      .filter(x=>x.v&&(!q||x.v.toLowerCase().includes(q)||x.c.t.toLowerCase().includes(q)||m.t.toLowerCase().includes(q)));

/* Décor du lecteur : chandeliers générés, dessinés au canvas */
function drawChart(seed){
  const cv=document.getElementById("chart");if(!cv)return;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  let s=seed;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const n=Math.floor(r.width/14),w=r.width/n;let p=r.height*.55;
  for(let i=0;i<n;i++){
    const o=p,cl=o+(rnd()-.5)*r.height*.09-(i/n)*1.2,h=Math.min(o,cl)-rnd()*r.height*.03,l=Math.max(o,cl)+rnd()*r.height*.03;
    const up=cl<o;g.globalAlpha=.22;g.strokeStyle=g.fillStyle=up?"#e8b84b":"#7e7e77";
    g.beginPath();g.moveTo(i*w+w/2,h);g.lineTo(i*w+w/2,l);g.stroke();
    g.fillRect(i*w+w*.22,Math.min(o,cl),w*.56,Math.max(1,Math.abs(cl-o)));p=Math.max(r.height*.15,Math.min(r.height*.85,cl));
  }
  g.globalAlpha=1;
}

function animateBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar i[data-w]").forEach(b=>b.style.width=b.dataset.w+"%")))}
function setNav(id,force){document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"true":"false"))}

function complete(){
  const {mi,ci}=view;const m=MODULES[mi];const c=m.chapters[ci];
  const beforeLvl=levelOf(totalXp()), wasDone=isComplete(m);
  const beforeBadges=BADGES.filter(b=>b.ok()).map(b=>b.id);
  S.done[c.id]=Date.now();save();updateChip();
  const afterLvl=levelOf(totalXp());
  const newBadges=BADGES.filter(b=>b.ok()&&!beforeBadges.includes(b.id));
  if(!wasDone&&isComplete(m)){
    renderModule(mi,ci);
    celebrate(m.cert?BADGES[BADGES.length-1]:BADGES.find(b=>b.id==="m"+m.n),
      m.cert?"Parcours certifié":"Module "+pad(m.n)+" validé",
      `+${m.cert?XP_CERT:XP_MOD} XP de bonus.`+(afterLvl>beforeLvl?` Tu passes au niveau ${LEVELS[afterLvl].name}.`:""),mi);
    return;
  }
  if(afterLvl>beforeLvl){renderModule(mi,ci);celebrate({id:"lvl",num:afterLvl+1},"Niveau "+LEVELS[afterLvl].name,"Tu as franchi une nouvelle étape du parcours.",mi);return}
  if(newBadges.length){renderModule(mi,ci);celebrate(newBadges[0],newBadges[0].t,newBadges[0].d,mi);return}
  toast(`<span class="xp">+${XP_CHAP} XP</span>`,esc(c.t)+" terminé");
  const nx=m.chapters.findIndex((ch,k)=>k>ci&&!S.done[ch.id]);
  renderModule(mi,nx>-1?nx:ci);
}
function undo(){const {mi,ci}=view;delete S.done[MODULES[mi].chapters[ci].id];save();updateChip();renderModule(mi,ci)}

let tmo;
function toast(icon,msg){const t=document.getElementById("toast");t.innerHTML=icon+"<span>"+msg+"</span>";t.classList.add("show");clearTimeout(tmo);tmo=setTimeout(()=>t.classList.remove("show"),2600)}

function celebrate(b,title,text,mi){
  const nextM=MODULES[mi+1];
  const canNext=nextM&&isComplete(MODULES[mi])&&!(nextM.cert&&!certUnlocked());
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${medal(b,"m")}
    <div class="eyebrow">Bravo</div><h3 id="mt">${esc(title)}</h3><p>${esc(text)}</p>
    <div class="row">${canNext?`<button class="btn btn-gold" data-next>Module ${pad(nextM.n)} ${I.arrow}</button>`:""}<button class="btn btn-ghost" data-close>Continuer</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.closest("[data-close]"))close();if(e.target.closest("[data-next]")){close();renderModule(mi+1,0)}});
  bg.querySelector("button").focus();
  confetti();
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("confetti"),g=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#f3d585","#e8b84b","#b98a2e","#f7f6f3"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*6+3,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*4|0]}));
  let f=0;(function tick(){g.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-f/120);g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});if(++f<130)requestAnimationFrame(tick);else g.clearRect(0,0,cv.width,cv.height)})();
}

function confirmBox(title,text,label,fn){
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3 style="font-size:24px">${title}</h3><p>${text}</p><div class="row"><button class="btn btn-gold" data-yes>${label}</button><button class="btn btn-ghost" data-close>Annuler</button></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.closest("[data-close]"))bg.remove();if(e.target.closest("[data-yes]")){bg.remove();fn()}});
}

function demo(){
  const now=Date.now(),W=7*864e5;let k=0;S=blank();
  const plan=[[0,7],[1,10],[2,5],[3,2]];
  plan.forEach(([mi,n])=>{for(let i=0;i<n;i++){S.done[MODULES[mi].chapters[i].id]=now-Math.max(0,(5-Math.floor(k/5)))*W-k*36e5;k++}});
  S.last=[3,2];save();updateChip();renderHome();toast("✦","Exemple chargé : réinitialise quand tu veux.");
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-mod],[data-open],[data-chap],[data-complete],[data-undo],[data-reset],[data-demo]");if(!t)return;
  if(t.dataset.go){ if(view.name!=="home"){view={name:"home"};renderHome(t.dataset.go)} else {const el=document.getElementById(t.dataset.go);el&&el.scrollIntoView({behavior:"smooth",block:"start"});setNav(t.dataset.go)} }
  else if(t.dataset.mod!=null){renderModule(+t.dataset.mod)}
  else if(t.dataset.open){const [a,b]=t.dataset.open.split(",").map(Number);renderModule(a,b)}
  else if(t.dataset.chap!=null){renderModule(view.mi,+t.dataset.chap)}
  else if(t.hasAttribute("data-complete"))complete();
  else if(t.hasAttribute("data-undo"))undo();
  else if(t.hasAttribute("data-reset"))confirmBox("Réinitialiser ma progression ?","Tous les chapitres, l'expérience, les badges et les notes de ce navigateur seront effacés.","Tout effacer",()=>{S=blank();save();updateChip();view={name:"home"};renderHome();toast("↺","Progression remise à zéro.")});
  else if(t.hasAttribute("data-demo"))confirmBox("Charger un exemple ?","Ta progression actuelle sera remplacée par un parcours fictif (modules 01 à 03 terminés, module 04 en cours).","Charger l'exemple",demo);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=document.querySelector(".modal-bg");m&&m.remove()}});
addEventListener("resize",()=>{if(view.name==="module")drawChart(view.mi*31+view.ci*7+3)});

updateChip();
const h=(location.hash||"").replace("#","");
const hm=h.match(/^m(\d{1,2})$/);
if(hm&&MODULES[+hm[1]-1])renderModule(+hm[1]-1);else renderHome();
</script>
